# Identity Bootstrap v1 -- every tunable the decision procedure reads. No number, word list, pattern or mapping may live in code.
# Each top-level section carries a provenance tag in `provenance:`
#   inherited  = stated by the task brief or by VEHICLE_DB_V3 / ENGINE_RULES
#   observed   = read from the repository or from the real M7.0 package
#   proposal   = a default chosen here, uncalibrated; the owner should review it
#   assumption = unverified; says so
version: 1

provenance:
  activation: inherited
  subject: observed
  brand: proposal
  lexical: observed
  shape: proposal
  relations: proposal
  batch: proposal
  lineage: proposal
  evidence: proposal
  allocation: inherited
  admin: proposal
  writes: inherited
  event: inherited
  priority: proposal
  fingerprint: proposal

# --- G0: when Bootstrap may run at all (Identity Resolution hand-off) ---------------------------------------------------------
activation:
  required_ir_outcome: NO_CANDIDATE            # anything else -> HOLD / NOT_ACTIVATED (STRUCTURAL_REVIEW -> REVIEW / STRUCTURAL_CONFLICT)
  structural_review_outcome: STRUCTURAL_REVIEW

# --- G1: the external identity itself -------------------------------------------------------------------------------------------
subject:
  creatable_identity_statuses: [settled]
  status_codes:                                # identity_status -> gate code
    provisional: PROVIDER_IDENTITY_PROVISIONAL
    unmapped_name: PROVIDER_RAW_NAME
  unavailable_name_values: ["ไม่ระบุ", "unknown", "na", "none", "other", "อื่นๆ"]   # compared on the name's compact form (lexical.compact)
  raw_name:
    separator_characters: ["|"]                # present in the entity id or the display name -> PROVIDER_RAW_NAME
    registration_code_token_pattern: "^(?=.*[a-z])(?=.*[0-9])[a-z0-9]{9,}$"   # defence in depth against adapter mistakes

brand:
  creatable_relations: [EXACT, ALIAS_SAME, ALIAS_RELABEL]
  relation_codes:                              # a relation that is not creatable -> code
    UNKNOWN: BRAND_UNKNOWN
    NOT_IN_TDR: BRAND_NOT_IN_TDR
    ALIAS_RELATED: STRUCTURAL_CONFLICT

# --- name tokens (pinned to Identity Resolution v1 SPEC §5.2 semantics; see SPEC §4) --------------------------------------------------
lexical:
  token_boundary_characters: ["-", "_", "/", ".", "+", "&", "|", "(", ")"]
  generic_tokens: ["series", "class"]

# --- G5: shape suspicions on the subject's own tokens ------------------------------------------------------------------------------
shape:
  model_code:
    token_patterns: ["^[a-z]{1,3}[0-9]{3}[a-z]{0,3}$"]
  trim:
    tokens: [sport, sports, premium, luxury, limited, edition, plus, pro, ultra, base, standard, deluxe, comfort, elite, exclusive, signature, gt, gti, rs, amg, ex, lx]
  powertrain:
    tokens: [ev, bev, hev, phev, mhev, hybrid, electric, diesel, petrol, gasoline, turbo, cng, lpg, awd, 4wd, 2wd, fwd, rwd, 4x4, 4x2, cvt, dct, manual]
    name_patterns: ["(?<![0-9])[0-9]\\.[0-9]{1,2}[a-z]?(?![0-9])"]   # a displacement such as 2.4 or 1.5t, matched on the lower-cased display name
  body:
    tokens: [hatchback, hatch, sedan, wagon, estate, coupe, convertible, cabriolet, roadster, cab, double, single, smart, pickup, van, suv, mpv, crossover, truck]
  generation:
    tokens: [new, facelift, refresh, redesign, generation, gen, "โฉมใหม่", "ไมเนอร์เชนจ์", "เจนใหม่"]
    token_patterns: ["^gen[0-9]+$", "^mk[0-9]+$", "^mk[ivx]+$", "^(19|20)[0-9]{2}$", "^[0-9]{1,2}(st|nd|rd|th)$"]
  codes:                                       # shape class -> code
    model_code: POSSIBLE_MODEL_CODE
    trim: POSSIBLE_TRIM_NOT_MODEL
    powertrain: POSSIBLE_POWERTRAIN_DERIVATIVE
    body: POSSIBLE_BODY_VARIANT
    generation: POSSIBLE_GENERATION_VARIANT

# --- G4: relation to existing / pending identities and to other subjects ----------------------------------------------------------------
relations:
  name_classes:                                # IR name relation -> class
    duplicate: [EQUAL, EQUAL_VIA_MODEL_ALIAS, EQUAL_VIA_TOKEN_EQUIV, FUZZY]
    finer: [SUBJECT_FINER]
    coarser: [SUBJECT_COARSER]
    sibling: [SIBLING]
    ignored: [CONTRADICTION, UNAVAILABLE]
  peer_state_classes:                           # identity_state of a TDR peer -> class (null = a legacy canonical model)
    DISCOVERED: pending
    ENRICHING: pending
    VERIFIED: canonical
    PUBLISHED: canonical
    WITHDRAWN: withdrawn
    legacy: canonical
  canonical_codes:                              # peer class canonical
    duplicate: DUPLICATE_CANONICAL_SUSPECTED
    finer: PROVIDER_FINER_THAN_TDR
    coarser: PROVIDER_COARSER_THAN_TDR
    sibling: EXISTING_IDENTITY_SUSPECTED
  pending_codes:                                # peer class pending (another DISCOVERED/ENRICHING identity)
    duplicate: IDENTITY_ALREADY_DISCOVERED
    finer: EXISTING_IDENTITY_SUSPECTED
    coarser: EXISTING_IDENTITY_SUSPECTED
    sibling: EXISTING_IDENTITY_SUSPECTED
  withdrawn_codes:                              # peer class withdrawn: only an equal name matters
    duplicate: IDENTITY_PREVIOUSLY_WITHDRAWN

# --- cross-subject arbitration (same snapshot) ---------------------------------------------------------------------------------------------
batch:
  ignore_peers_holding: [PROVIDER_IDENTITY_PROVISIONAL, PROVIDER_RAW_NAME, NAME_UNSPECIFIED, BRAND_UNKNOWN]   # junk never blocks a clean peer
  same_provider:
    duplicate: [STRUCTURAL_CONFLICT, DUPLICATE_CANONICAL_SUSPECTED]   # on both members
    finer: [STRUCTURAL_CONFLICT]                                      # on the finer member only
    sibling: [STRUCTURAL_CONFLICT]                                    # on both members
  cross_provider:
    duplicate: COALESCE                                               # one identity, several aliases
    finer: [STRUCTURAL_CONFLICT]
    sibling: [STRUCTURAL_CONFLICT]
  provider_priority: [ice, dlt]                                            # representative = best (provider rank, provider, entity id)

# --- provider lineage (id_changes) ----------------------------------------------------------------------------------------------------------------
lineage:
  actions:
    rename_old_bound: HOLD_CONTINUITY                # old id already bound to an identity
    rename_old_unbound: PROCEED_WITH_RETIRED_ALIAS
    merge_old_bound_to_one: HOLD_CONTINUITY
    merge_old_bound_to_many: REVIEW_AMBIGUOUS        # TDR identities are never merged automatically
    merge_none_bound: PROCEED_WITH_RETIRED_ALIAS
    split_any_role: REVIEW_AMBIGUOUS                 # parent or child, applied or not
    cycle: HOLD_UNRESOLVED

# --- G6: evidence tiers -------------------------------------------------------------------------------------------------------------------------------
evidence:
  kind_tiers:
    PROVIDER_IDENTITY: 0
    SECOND_PROVIDER_IDENTITY: 1
    REGULATORY_RECORD: 2
    HOMOLOGATION: 2
    ECO_STICKER: 2
    OFFICIAL_PRICE_LIST: 3
    OFFICIAL_DISTRIBUTOR: 3
    OFFICIAL_LAUNCH_MATERIAL: 3
    OFFICIAL_MANUFACTURER: 3
  providers:                                  # who may be the creation basis; an unlisted provider cannot create
    ice:
      may_create: true
      base_kind: PROVIDER_IDENTITY
    dlt:                                      # assumption: listed so cross-provider rules are exercised; no adapter exists for it
      may_create: true
      base_kind: SECOND_PROVIDER_IDENTITY
  required_tier:
    create_clean: 0
  soft_clear:
    min_tier: 2
    required_attestation: is_model_nameplate
  corroboration_kind: SECOND_PROVIDER_IDENTITY

# --- G7: canonical id allocation ----------------------------------------------------------------------------------------------------------------------
allocation:
  id_format: "{brand_id}.{local}"
  local_segment_function: vehreg.normalize.slug      # the one slug rule (ENGINE_RULES §3 item 1); never reimplemented
  forbidden_local_segments: [unnamed]
  canonical_name:
    strip_brand_prefix: true
    collapse_whitespace: true
  collision_resolution: REVIEW                       # ids are never auto-suffixed in v1
  tombstones_reserve_ids: true

# --- admin structure decisions --------------------------------------------------------------------------------------------------------------------------------
admin:
  directive_actions: [CREATE_IDENTITY, DO_NOT_CREATE]
  creator_type_machine: machine
  creator_type_admin: admin

# --- write plan -------------------------------------------------------------------------------------------------------------------------------------------------------
writes:
  apply_mode: PROPOSE                           # PROPOSE (a card an admin approves) | DIRECT; DIRECT needs the owner's VEHICLE_DB_V3 §4 amendment
  actor_kind: BOOTSTRAP
  required_permission: CREATE_DISCOVERED_SHELL
  initial_state:
    identity_state: DISCOVERED
    enrichment_state: PENDING
  shell_columns: [canonical_id, brand_id, slug, name_en, identity_state, enrichment_state]
  forbidden_attribute_fields: [segment, body_type, cab_type, registration_type, market_scope, powertrain, market_position, production, launch_date, engine, motor, battery, price, retail_price_min, retail_price_max, platform, origin_country, description, name_th, generation_id]
  operations: [RESERVE_CANONICAL_ID, INSERT_IDENTITY_SHELL, INSERT_EXTERNAL_ALIAS, INSERT_PROVENANCE, ENQUEUE_EVENT, PROPOSE_ORIGIN_MAPPING]
  lock_key: "identity_bootstrap:{brand_id}"
  conflict_policy: DO_NOTHING_VERIFY_SAME

event:
  name: VEHICLE_IDENTITY_CREATED
  version: 1
  outbox: vehicle_identity_events
  delivery: at_least_once
  include_provider_hints: true

# --- volume: ordering and alerting ONLY -- never an input to the outcome (a property test enforces this) -----------------------------------
priority:
  bands:
    - {min_units: 0, band: LOW}
    - {min_units: 100, band: MEDIUM}
    - {min_units: 2000, band: HIGH}
  unknown_units_band: UNRANKED
  queues:
    IDENTITY_REVIEW: identity_review
    HOLD: identity_hold_watch
  silent_hold_codes: [NOT_ACTIVATED, IDENTITY_ALREADY_DISCOVERED, IDENTITY_COALESCED, ADMIN_DECLINED, LINEAGE_CONTINUITY_EXISTING_IDENTITY]   # holds nobody needs to watch
  alert_bands: [HIGH]                          # a HOLD/IDENTITY_REVIEW in these bands carries alert HIGH_VOLUME_UNRESOLVED

fingerprint:
  algorithm: sha256
  decision_includes_policy_digest: true
  never_in_fingerprints: [units, source_version, first_seen_period, run_id, created_at]

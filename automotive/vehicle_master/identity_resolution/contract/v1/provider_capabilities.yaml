# TDR Identity Resolution — provider capability declarations v1 (DRAFT, not frozen)
#
# What a source's data MEANS is data, not an assumption buried in an adapter or in the engine (SPEC §3.2). Each
# source declares, per capability key, what it has CONFIRMED. The adapter reads this file to build the dense
# series it hands the engine; the engine reads it to refuse a snapshot that claims more than the contract does.
#
# v1 defines one capability key:
#
#   series.absent_row   what a (entity, month) with NO source row inside the source's declared coverage means.
#       ABSENT_IS_ZERO         the source confirmed: no row = zero units. The adapter MAY write 0 for those months.
#       ABSENT_IS_UNOBSERVED   the source confirmed: no row = no data / not reported. The adapter writes null.
#       UNKNOWN                nobody has confirmed either reading. The adapter writes null. A hypothesis may be
#                              recorded, but a hypothesis NEVER licenses a zero.
#
# Rules (enforced by tests and by SPEC §3.2 / §6.2):
#   * `status: confirmed` is allowed only for ABSENT_IS_ZERO / ABSENT_IS_UNOBSERVED and requires who confirmed it,
#     when, and a reference; UNKNOWN is always `status: unconfirmed`.
#   * Changing a value (for example UNKNOWN -> ABSENT_IS_ZERO after Ice answers) is a contract change: edit this
#     file, add or update the corpus cases that pin the new behaviour, and record it in CHANGELOG.md.
#   * A source that is not listed here has no confirmed capabilities: its absent rows are unobserved.

version: v1

capability_keys:
  series.absent_row:
    values: [ABSENT_IS_ZERO, ABSENT_IS_UNOBSERVED, UNKNOWN]
    zero_fill_allowed_only_when: "value == ABSENT_IS_ZERO and status == confirmed"

sources:
  ice:
    role: provider
    description: Ice monthly registration trend (reg_trend.csv), model_group grain, Buddhist-era periods converted by the adapter.
    series.absent_row:
      value: UNKNOWN
      status: unconfirmed
      hypothesis: ABSENT_IS_ZERO
      evidence:
        - "M7.0 reg_trend.csv ships no zero rows: 0 of 262,985 rows have a count <= 0."
        - "518 of 1,200 M7.0 model_groups have months without a row between their first and last month."
        - "reg_trend grain is (period, province, reg_type, brand, model_group_id); a model_group-month is 'absent' when no province row exists for it at all."
        - "Both facts are consistent with 'absent = zero' and with 'absent = not reported'; none of the package documents inspected (trend/method.md, dims/method.md, README_นำเข้า.md, SKILL.md) states either reading."
      confirm_with: Ice (package owner)
      question_id: Q-ICE-ABSENT-ROW
      question: "In reg_trend.csv, does a model_group with no row for a month inside reg_range mean zero registrations that month, or no data?"
  tdr_registrations:
    role: target_side
    description: TDR registrations table (supabase registrations), one row per (period, brand_name_raw, model_name_raw), attributed to canonical models by TDR's own resolution.
    series.absent_row:
      value: UNKNOWN
      status: unconfirmed
      hypothesis: null
      evidence:
        - "supabase/schema.sql: registrations has unique(period, brand_name_raw, model_name_raw) and `registrations integer not null`; no rule says a month without a row is zero."
        - "docs/REGISTRATION_MARKET_CONTRACT.md (Time windows): TDR's own serving layer REJECTS a window with a missing calendar month rather than reading it as zero."
      confirm_with: TDR owner (registrations import contract)
      question_id: Q-TDR-ABSENT-ROW
      question: "Does the registrations import ever store zero rows? If not, is a model-month with no rows zero, or unreported?"

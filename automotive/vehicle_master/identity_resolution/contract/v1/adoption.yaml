# TDR Identity Resolution — adoption gate v1 (DRAFT, NOT FROZEN — revision 5)
#
# The numbers and switches in policy.yaml tagged `proposal` or `assumption` have NOT been calibrated against
# production data and have not been signed off. (The first R6 run's rows were recovered read-only on 2026-10-11 into calibration/, but they
# carry no owner labels, so nothing can be calibrated yet.)
# They are PROVISIONAL. This file is the gate that keeps them from being adopted by accident:
#
#   * `binding: false` means a run under this policy is a DRY RUN (SPEC invariant I16): the engine may emit
#     records, but their `writes` are advisory, no AUTO is persisted, and nothing may be APPROVED on their
#     strength. policy_ref.binding carries the flag in every record.
#   * Every `proposal` / `assumption` leaf of policy.yaml belongs to EXACTLY ONE entry below (a test enforces it),
#     with its class, status and what would settle it.
#   * `binding` may become true only when every entry is `calibrated` or `owner_accepted` (a test enforces it).
#     Flipping it is a contract change: a policy MAJOR/MINOR bump, a CHANGELOG line and an owner decision.
#
# Classes
#   calibration   a numeric tunable: settle it against labelled data (below), never by taste.
#   representation  a definition (rounding places, calendar sanity bounds, token boundary characters): no data can
#                 calibrate it; the owner signs it off.
#   design_choice a switch, list, order or route: an owner decision, recorded.
#
# Labelled data a calibration entry needs ("the label set"): the owner's decisions on the first R6 run's candidate rows
# (accepted / rejected / changed, with the final TDR model), plus the owner's APPROVED crosswalk rows, joined to the M7.0
# package and to TDR registrations. Selection protocol: choose on a training part, confirm on a held-out part (split by
# brand, not by row), and report precision and recall separately for AUTO and for PROPOSE. A value is `calibrated` only
# when that report exists and the owner has read it; "no AUTO row the owner labels wrong" is the bar for any AUTO gate.
#
# Status values: pending | calibrated | owner_accepted.
#
# `owner_decisions` records what the owner has decided about the CONTRACT (as opposed to the numbers). They are not thresholds and need no
# calibration. `accepted` = adopted into the draft contract; `standing` = a condition that stays in force until the owner lifts it
# (status `lifted`, with a dated note). A test refuses `binding: true` unless the standing decisions about it were lifted.

version: v1
binding: false
status: provisional_not_frozen

owner_decisions:
  - id: od_link_types
    decided_on: "2026-10-11"
    status: accepted
    decision: "Accept the three link types: EQUIVALENT, PART_OF, COMPOSED_OF."
    refs: ["SPEC §7.0"]
  - id: od_cardinality_rules
    decided_on: "2026-10-11"
    status: accepted
    decision: "Accept the two cardinality rules as v1: C1 (one active claim per subject) and C2 (a target claimed whole is claimed once; PART_OF claims may share a target)."
    refs: ["SPEC §7.0", "SPEC I12"]
  - id: od_atomic_link_sets
    decided_on: "2026-10-11"
    status: accepted
    decision: "Keep bundles as real atomic link sets, not review-only evidence."
    refs: ["SPEC §7.3", "SPEC §10.5", "SPEC I17"]
  - id: od_persistence_link_type_identity
    decided_on: "2026-10-11"
    status: accepted
    decision: "Accept extending persistence identity with link_type (claim key (provider, subject_id, target_id, link_type); set_id / set_size for link sets). Legacy overlapping claims must be reported and never auto-repaired."
    refs: ["SPEC §10.6", "SPEC §8.2 step 0", "SPEC I18"]
    note: "Logical contract only. No DDL, migration or write path is authorised by this decision."
  - id: od_lexical_relation_correction
    decided_on: "2026-10-11"
    status: accepted
    decision: "Correct the name-relation ladder after the M7 lexical/relation analysis: FUZZY must not fuzzy-match differing tokens containing digits; SIBLING must require a genuinely distinctive shared token, by a generic policy-driven rule and not by hardcoding V / CX / GR / RS / AMG as model exceptions; add the Honda-scoped model synonyms Jazz <-> Fit and Stepwagon <-> Step WGN."
    refs: ["SPEC §5.3", "SPEC §5.4", "SPEC I19", "calibration/lexical_pass/LEXICAL_PASS_REPORT.md", "taxonomy NAME-14..NAME-17"]
    note: "The RULES are the owner's. The descriptor vocabulary, the token-length floor and the patterns that implement 'distinctive' are the pass's proposals and stay pending (lexical_distinctive_min_length, lexical_distinctive_vocabulary). Production, DB state, mappings, R6/R7, migrations, engine wiring, adoption binding and freeze state were not touched."
  - id: od_relation_first_producer_pool
    decided_on: "2026-10-12"
    status: accepted
    decision: "INIT-01. A consumer of the producer MUST use the producer's typed brand relation and candidate pool as the authoritative matching input and MUST NOT independently resolve brand relations from catalog brand labels or aliases. Candidate-pool membership does not mean any candidate pair is correct; R6 pair verdicts and PR #201 CREATE / group verdicts remain separate owner questions and nothing is inferred between them."
    refs: ["PR #200 comment 6117608686 (owner adjudication, INIT-01)", "owner_decision_pack/initial_owner_decisions.csv#INIT-01"]
    note: "The RELATED -> PROPOSE ceiling that comment also stated is SUPERSEDED by od_related_brand_auto_eligible. Recorded from the owner's comment; no consumer code, export or PR #201 file was changed by this decision."
  - id: od_catalog_brand_alias_not_a_relation
    decided_on: "2026-10-12"
    status: accepted
    decision: "INIT-02. A catalog brand `aliases` entry is NOT by itself an authoritative typed brand or identity relationship: brand resolution follows the versioned, provenance-backed SAME / RELABEL / RELATED policy classes. JETOUR is a separate vehicle brand, not Chery; the typed relationship between them is RELATED (policy alias class chery_jetour), never SAME or RELABEL. A distinct TDR brand record for JETOUR, if needed, is a separate catalog decision and is not created here."
    refs: ["PR #200 comment 6117626098 (owner adjudication, INIT-02)", "policy.yaml aliases.brand chery_jetour"]
    note: "Recorded from the owner's comment. No catalog brand was created and no Chery catalog alias was changed."
  - id: od_related_brand_auto_eligible
    decided_on: "2026-10-12"
    status: accepted
    decision: "ALIAS_RELATED is AUTO-eligible. A RELATED-brand candidate may be an AUTO EQUIVALENT machine mapping if and only if it independently passes every existing AUTO gate (strong common-window series and sufficient sample, an approved lexical AUTO relation, exact supported model scope, no body / lifecycle / gap / provenance / lineage veto, margin and cardinality protection, no competing, protected or rejected conflict). A corporate or brand-family relationship alone never implies same-model identity. AUTO is an auditable, reversible machine state, not owner APPROVED / LOCKED, not a canonical-model mutation, not a PR #201 CREATE approval and not a production write."
    refs: ["PR #200 comment 6117676961 (owner policy override)", "SPEC §5.1 step 5", "SPEC I20", "policy.yaml candidates.brand_relations_auto_eligible", "taxonomy BRND-08, BRND-09", "calibration/related_auto/RELATED_AUTO_IMPACT.md"]
    note: "Supersedes the AUTO-cap portion of the INIT-01 comment. Authorises a DRAFT policy revision with offline fixtures, tests and impact evidence only: no R6/R7 live run, no PR #201 edit, no production access, no canonical write, no paid provider, no merge, deploy, adoption or engine rollout. The rev 4 outputs (relation export, owner pack, calibration outputs) are kept as the historical baseline (calibration/baselines/rev4). adoption binding stays false."
  - id: od_thai_market_brand_filing
    decided_on: "2026-10-12"
    status: accepted
    decision: "INIT-03. The canonical BRAND a vehicle is filed under follows its actual Thai-market identity and distributor, never its body type alone: MG and MAXUS are separate brands generally (MG Maxus passenger program vs the independently imported MAXUS commercial brand). Explicit case-level filings: Mifa 7 -> MG; Mifa 9 -> MG; V80 -> MG (a deliberate exception to any inference that a commercial vehicle is filed under MAXUS)."
    refs: ["PR #200 comment 6118608273 (owner adjudication, INIT-03 filing principle)", "PR #200 comment 6118627576 (owner decision, INIT-03 model-specific filing)", "PR #200 comment 6119320447 (decision-round closure)", "owner_decision_pack/initial_owner_decisions.csv#INIT-03"]
    note: "Brand filing ONLY. It is not a CREATE approval for V80 (OD-C11) and not a CORRECT_* verdict for R6-190 / R6-183 / R6-184: those cells stay blank and need their own evidence and decisions. No catalog, policy, crosswalk, production or canonical data was changed, and the frozen rev 4 Owner Decision Pack is not edited."
  - id: od_catalog_model_alias_not_identity
    decided_on: "2026-10-12"
    status: accepted
    decision: "INIT-04. A TDR catalog MODEL `aliases` entry is a lookup / candidate-discovery / preliminary lexical-matching aid. Its presence alone does NOT assert that an Ice group and the catalog model are the same vehicle and is not an owner-approved identity link. A model alias by itself must never trigger AUTO: AUTO needs the candidate to independently pass every other applicable gate of the current draft contract (registration-series evidence, coverage, name / vehicle context, lifecycle and body compatibility, ambiguity and protected-state rules)."
    refs: ["PR #200 comment 6118641819 (owner adjudication, INIT-04)", "PR #200 comment 6119320447 (decision-round closure)", "SPEC §5.4", "SPEC §14.2", "SPEC I20", "owner_decision_pack/initial_owner_decisions.csv#INIT-04"]
    note: "Policy principle only: no code, configuration, corpus, export or canonical change, and none of OD-A01..OD-A09, the child CREATE cells or the R6 pair verdicts is inferred from it. Rev 5 already enforces the principle without a change: the evaluator and adapters never read a catalog model `aliases` field (the only model-name channel is the explicit, scoped policy aliases.model pair table), and even EQUAL_VIA_MODEL_ALIAS still needs every other AUTO gate (corpus classify.name-only-model-alias-is-a-candidate and classify.auto-via-model-alias, run by tests/identity_resolution/test_ir_corpus.py). Brand alias governance (od_catalog_brand_alias_not_a_relation), brand filing (od_thai_market_brand_filing) and per-model R6 / CREATE decisions stay separate."
  # ---- OD-A01..OD-A09: the owner's SCREENING dispositions of the nine catalog-alias collisions (catalog_alias_collisions.csv). They are not review-session completions:
  # each session's CREATE / pair / alias-class cells must still pass validate_session individually, and the frozen rev 4 owner pack is not edited.

# TDR Identity Resolution — adoption gate v1 (DRAFT, NOT FROZEN — revision 3)
#
# The numbers and switches in policy.yaml tagged `proposal` or `assumption` have NOT been calibrated against
# production data (the first R6 run's review rows are not in the repository) and have not been signed off.
# They are PROVISIONAL. This file is the gate that keeps them from being adopted by accident:
#
#   * `binding: false` means a run under this policy is a DRY RUN (SPEC invariant I16): the engine may emit
#     records, but their `writes` are advisory, no AUTO is persisted, and nothing may be APPROVED on their
#     strength. policy_ref.binding carries the flag in every record.
#   * Every `proposal` / `assumption` leaf of policy.yaml belongs to EXACTLY ONE entry below (a test enforces it),
#     with its class, status and what would settle it.
#   * `binding` may become true only when every entry is `calibrated` or `owner_accepted` (a test enforces it).
#     Flipping it is a contract change: a policy MAJOR/MINOR bump, a CHANGELOG line and an owner decision.
#
# Classes
#   calibration   a numeric tunable: settle it against labelled data (below), never by taste.
#   representation  a definition (rounding places, calendar sanity bounds, token boundary characters): no data can
#                 calibrate it; the owner signs it off.
#   design_choice a switch, list, order or route: an owner decision, recorded.
#
# Labelled data a calibration entry needs ("the label set"): the owner's decisions on the first R6 run's candidate rows
# (accepted / rejected / changed, with the final TDR model), plus the owner's APPROVED crosswalk rows, joined to the M7.0
# package and to TDR registrations. Selection protocol: choose on a training part, confirm on a held-out part (split by
# brand, not by row), and report precision and recall separately for AUTO and for PROPOSE. A value is `calibrated` only
# when that report exists and the owner has read it; "no AUTO row the owner labels wrong" is the bar for any AUTO gate.
#
# Status values: pending | calibrated | owner_accepted.
#
# `owner_decisions` records what the owner has decided about the CONTRACT (as opposed to the numbers). They are not thresholds and need no
# calibration. `accepted` = adopted into the draft contract; `standing` = a condition that stays in force until the owner lifts it
# (status `lifted`, with a dated note). A test refuses `binding: true` unless the standing decisions about it were lifted.

version: v1
binding: false
status: provisional_not_frozen

owner_decisions:
  - id: od_link_types
    decided_on: "2026-10-11"
    status: accepted
    decision: "Accept the three link types: EQUIVALENT, PART_OF, COMPOSED_OF."
    refs: ["SPEC §7.0"]
  - id: od_cardinality_rules
    decided_on: "2026-10-11"
    status: accepted
    decision: "Accept the two cardinality rules as v1: C1 (one active claim per subject) and C2 (a target claimed whole is claimed once; PART_OF claims may share a target)."
    refs: ["SPEC §7.0", "SPEC I12"]
  - id: od_atomic_link_sets
    decided_on: "2026-10-11"
    status: accepted
    decision: "Keep bundles as real atomic link sets, not review-only evidence."
    refs: ["SPEC §7.3", "SPEC §10.5", "SPEC I17"]
  - id: od_persistence_link_type_identity
    decided_on: "2026-10-11"
    status: accepted
    decision: "Accept extending persistence identity with link_type (claim key (provider, subject_id, target_id, link_type); set_id / set_size for link sets). Legacy overlapping claims must be reported and never auto-repaired."
    refs: ["SPEC §10.6", "SPEC §8.2 step 0", "SPEC I18"]
    note: "Logical contract only. No DDL, migration or write path is authorised by this decision."
  - id: od_ice_absent_row_unknown
    decided_on: "2026-10-11"
    status: standing
    decision: "Keep Ice absent-row semantics UNKNOWN until Ice explicitly confirms them."
    refs: ["provider_capabilities.yaml sources.ice", "SPEC I4a", "SPEC §3.2"]
  - id: od_tdr_absent_row_traced
    decided_on: "2026-10-11"
    status: standing
    decision: "For TDR registrations do not assume: trace the actual source pipeline, and declare absent=zero only if complete month x dimension coverage is contractually guaranteed; otherwise keep UNKNOWN."
    refs: ["provider_capabilities.yaml sources.tdr_registrations.trace", "SPEC §3.2"]
    result: "Traced 2026-10-11 (repository read only): no stage guarantees complete month x dimension coverage. Stays UNKNOWN; trace.upgrade_requires lists what would have to become contractual."
  - id: od_binding_false
    decided_on: "2026-10-11"
    status: standing
    decision: "Keep adoption binding=false and every provisional threshold non-authoritative until calibration against the real R6 review data."
    refs: ["SPEC §14.6", "SPEC I16"]
  - id: od_not_frozen
    decided_on: "2026-10-11"
    status: standing
    decision: "Do not freeze Contract v1. Wait for CI, incorporate the decisions above, then stop for threshold and data-semantics calibration."
    refs: ["SPEC §16", "CHANGELOG.md"]

entries:
  # ----------------------------------------------------------------------------------- representation
  - id: representation_constants
    class: representation
    keys: [quantization, time.valid_year_range, lexical.token_boundary_characters]
    status: pending
    decision: "Confirm: 6-place half-even quantization, 1900-2200 calendar sanity range, and the token boundary character set."
  # ----------------------------------------------------------------------------------- calibration (numeric)
  - id: series_minimums
    class: calibration
    keys: [series.minimums]
    status: pending
    settles_with: "Label set: distribution of common months / joint non-zero months / units for owner-accepted vs owner-rejected rows; choose the lowest AUTO minimum with no wrong AUTO on the held-out brands."
  - id: series_monthly_fit
    class: calibration
    keys: [series.monthly_fit]
    status: pending
    settles_with: "Label set: monthly-fit share of accepted vs rejected strong-looking pairs (the outlier-driven correlation cases)."
  - id: series_absent_row_gap
    class: calibration
    keys: [series.absent_row]
    status: pending
    settles_with: "Ice's explicit answer to Q-ICE-ABSENT-ROW and, for TDR, the contractual guarantees listed in provider_capabilities.yaml (trace.upgrade_requires) first; then, on the label set, how many unconfirmed-gap months an accepted AUTO-grade pair tolerates. 0 is the safe default until then."
  - id: lexical_fuzzy_min_length
    class: calibration
    keys: [lexical.fuzzy_token.min_token_length]
    status: pending
    settles_with: "Label set: one-edit name pairs the owner accepted vs rejected, by token length."
  - id: attributes_lifecycle
    class: calibration
    keys: [attributes.lifecycle]
    status: pending
    settles_with: "TDR generation dates vs owner-labelled generation mismatches (grace months, within/disjoint shares)."
  - id: subject_discovery_thresholds
    class: calibration
    keys: [subject_quality.discovery]
    status: pending
    settles_with: "Size of the discovery queue the owner can actually review; units of subjects the owner later added to the catalog."
  - id: candidates_bundle_bounds
    class: calibration
    keys: [candidates.bundle.max_members, candidates.bundle.max_pool_for_enumeration]
    status: pending
    settles_with: "Largest COMPOSED_OF set the owner accepted in the label set; enumeration cost is bounded by these two numbers."
  - id: candidates_margin
    class: calibration
    keys: [candidates.margin]
    status: pending
    settles_with: "Label set: pairs of rival candidates the owner judged tied vs separable, by correlation and |ln ratio| gap."
  - id: granularity_part_of_ratio
    class: calibration
    keys: [granularity.part_of.min_ratio_above]
    status: pending
    settles_with: "Label set: subjects the owner accepted as PART_OF a larger TDR model, by target/subject ratio."
  - id: data_sufficiency_wrong_series
    class: calibration
    keys: [data_sufficiency.series_decisively_wrong]
    status: pending
    settles_with: "Label set: pairs the owner called plainly different, by correlation and ratio; defines when absence of a candidate is affirmative."
  - id: fingerprint_bands
    class: calibration
    keys: [fingerprint.bands]
    status: pending
    settles_with: "How often a REJECTED pair's band label changes between consecutive packages for pairs the owner still considers wrong; choose edges that reopen only on a real change."
  # ----------------------------------------------------------------------------------- design choices (owner decisions)
  - id: series_window_switches
    class: design_choice
    keys: [series.window.trim_inactive_edges, series.window.exclude_partial_periods]
    status: pending
    decision: "Confirm trimming of both-zero edge months and exclusion of partial periods."
  - id: lexical_token_equivalences
    class: design_choice
    keys: [lexical.token_equivalences]
    status: pending
    decision: "Confirm each equivalence (ev=electric, hatch=hatchback, hev=hybrid); each is an assumption about TDR naming."
  - id: lexical_fuzzy_switch
    class: design_choice
    keys: [lexical.fuzzy_token.enabled]
    status: pending
    decision: "Decide whether one-edit typo tolerance exists at all (PROPOSED at most)."
  - id: lexical_name_relation_roles
    class: design_choice
    keys: [lexical.name.auto_relations, lexical.name.candidate_relations, lexical.name.veto_relations, lexical.series_only]
    status: pending
    decision: "Confirm which name relations may be AUTO, may be a name-only candidate, or veto."
  - id: attributes_target_status
    class: design_choice
    keys: [attributes.target_status]
    status: pending
    decision: "Confirm that UNVERIFIED targets are capped at PROPOSED."
  - id: subject_never_auto_statuses
    class: design_choice
    keys: [subject_quality.never_auto_identity_statuses]
    status: pending
    decision: "Confirm that provisional and raw-name subjects are never AUTO."
  - id: candidates_pool_rules
    class: design_choice
    keys: [candidates.brand_relations_allowed, candidates.brand_relations_auto_eligible, candidates.target_statuses_in_pool, candidates.exclude_deleted_targets]
    status: pending
    decision: "Confirm the candidate pool and which brand relations are AUTO-eligible (RELATED is capped)."
  - id: candidates_bundle_enabled
    class: design_choice
    keys: [candidates.bundle.enabled]
    status: owner_accepted
    owner_decision: od_atomic_link_sets
    decision: "COMPOSED_OF link sets exist (the owner chose real atomic link sets over review-only bundles on 2026-10-11)."
  - id: candidates_ranking
    class: design_choice
    keys: [candidates.ranking]
    status: pending
    decision: "Confirm the lexicographic ranking order (never a weighted sum)."
  - id: candidates_bundle_members
    class: design_choice
    keys: [candidates.bundle.member_name_relations]
    status: pending
    decision: "Confirm which name relations may be members of a link set (the existence of link sets is decided: od_atomic_link_sets)."
  - id: granularity_part_of_rules
    class: design_choice
    keys: [granularity.part_of.subject_name_relations, granularity.part_of.arbitration_sum_check]
    status: pending
    decision: "Confirm that a narrower provider name plus a clearly larger target means PART_OF, and that several subjects whose sum fits one target are all parts."
  - id: lineage_rules
    class: design_choice
    keys: [lineage]
    status: pending
    decision: "Confirm quarantine scope, the STRUCTURE card instead of copied rows, and how identity changes treat APPROVED / LOCKED rows."
  - id: state_write_matrix
    class: design_choice
    keys: [state.write_matrix]
    status: pending
    decision: "Confirm the action for each (existing state x engine decision) cell."
  - id: review_routing
    class: design_choice
    keys: [review]
    status: pending
    decision: "Confirm review queues, discovery flags and which codes are high priority."
  - id: alias_assumptions
    class: design_choice
    keys: [alias_provenance.land_range_rover, alias_provenance.gwm_sub_brands]
    status: pending
    decision: "Confirm the two RELATED brand classes marked assumption in alias_provenance (Land Rover/Range Rover; GWM sub-brands)."

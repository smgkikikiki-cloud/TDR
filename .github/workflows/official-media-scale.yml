name: Official media scale 103

on:
  push:
    branches: [feat/official-media-scale-100]
    paths:
      - ".github/workflows/official-media-scale.yml"
      - "automotive/vehicle_master/config/official_media_targets_2026.txt"
      - "automotive/vehicle_master/scripts/ingest_official_media_scale.py"
      - "automotive/vehicle_master/scripts/ingest_official_media.py"
      - "automotive/vehicle_master/vehreg/official_media/**"
      - "automotive/vehicle_master/tests/test_official_media.py"
      - "scripts/publish-official-media.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-media-scale-103
  cancel-in-progress: true

jobs:
  scale-103:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_PREVIEW_URL: https://tdr-git-feat-official-media-scale-100-kiki-ed8b.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automotive/vehicle_master/requirements.txt

      - name: Install Python dependencies
        working-directory: automotive/vehicle_master
        run: python -m pip install -r requirements.txt pytest

      - name: Run official-media unit tests
        working-directory: automotive/vehicle_master
        run: python -m pytest -q tests/test_official_media.py

      - name: Validate scale target set
        working-directory: automotive/vehicle_master
        shell: bash
        run: |
          test "$(grep -cv '^\s*$' config/official_media_targets_2026.txt)" -eq 103
          test "$(sort config/official_media_targets_2026.txt | uniq | wc -l)" -eq 103

      - name: Crawl 103 active canonical visual identities
        working-directory: automotive/vehicle_master
        shell: bash
        run: |
          mapfile -t VEHICLE_IDS < config/official_media_targets_2026.txt
          python scripts/ingest_official_media_scale.py \
            --year 2026 \
            --max-pages 5 \
            --workers 10 \
            --vehicle-ids "${VEHICLE_IDS[@]}"

      - name: Summarize scale coverage
        working-directory: automotive/vehicle_master
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path("integration_data/official_media/run_summary_2026.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          if len(rows) != 103:
              raise SystemExit(f"expected 103 identities, got {len(rows)}")

          grouped = defaultdict(lambda: {"models": 0, "covered": 0, "approved": 0, "assets": 0, "review": 0})
          for row in rows:
              item = grouped[row["brand"]]
              item["models"] += 1
              item["covered"] += row["assets"] > 0
              item["approved"] += row.get("approved", 0) > 0
              item["assets"] += row["assets"]
              item["review"] += row["review"]

          covered = sum(row["assets"] > 0 for row in rows)
          approved = sum(row.get("approved", 0) > 0 for row in rows)
          assets = sum(row["assets"] for row in rows)
          reviews = sum(row["review"] for row in rows)

          out = Path("/tmp/media-scale-summary.md")
          with out.open("w") as fh:
              fh.write("# Official media scale run\n\n")
              fh.write(f"103 identities attempted. {covered}/103 produced assets; {approved}/103 produced at least one auto-approved asset. {assets} assets cached; {reviews} review flags.\n\n")
              fh.write("| Brand | Target | Covered | Approved | Assets | Review |\n|---|---:|---:|---:|---:|---:|\n")
              for brand in sorted(grouped):
                  item = grouped[brand]
                  fh.write(f"| {brand} | {item['models']} | {item['covered']} | {item['approved']} | {item['assets']} | {item['review']} |\n")
              fh.write("\n## Missing approval\n\n")
              for row in rows:
                  if not row.get("approved", 0):
                      fh.write(f"- `{row['vehicle_id']}` — {row['model']} ({row['assets']} assets, {row['review']} review)\n")
          print(out.read_text())
          PY
          cat /tmp/media-scale-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve crawl evidence
        uses: actions/upload-artifact@v4
        with:
          name: official-media-scale-${{ github.sha }}
          path: |
            automotive/vehicle_master/integration_data/official_media
            automotive/vehicle_master/data/media/cache
            /tmp/media-scale-summary.md
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Preflight publish credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::SUPABASE_URL is not configured in Actions secrets"
            exit 1
          fi
          if [ -z "${SUPABASE_SECRET_KEY}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is required"
            exit 1
          fi

      - name: Publish approved scale assets and metadata
        run: npm run media:publish -- --year 2026

      - name: Verify published media renders on Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          html=/tmp/vercel-models.html
          headers=/tmp/vercel-models.headers
          ok=0
          protected=0
          for attempt in $(seq 1 12); do
            curl_args=(-sS -L --max-time 30 -D "$headers" -o "$html" -w '%{http_code} %{url_effective}')
            if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              curl_args+=(
                -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"
                -H "x-vercel-set-bypass-cookie: true"
              )
            fi
            meta=$(curl "${curl_args[@]}" "${VERCEL_PREVIEW_URL}/models?media-smoke=${GITHUB_SHA}" || true)
            status=${meta%% *}
            effective=${meta#* }
            title=$(grep -oi '<title[^>]*>[^<]*</title>' "$html" | head -1 || true)
            refs=$(grep -o 'vehicle-media' "$html" | wc -l | tr -d ' ' || true)
            echo "Vercel /models status=${status} refs=${refs:-0} effective=${effective} title=${title} (attempt ${attempt})"

            if [[ "$effective" == https://vercel.com/login* ]] || [[ "$title" == *"Login – Vercel"* ]] || grep -qi 'x-vercel-challenge-token' "$headers"; then
              protected=1
              break
            fi
            if [ "$status" = "200" ] && [ "${refs:-0}" -ge 45 ]; then
              ok=1
              break
            fi
            sleep 10
          done

          if [ "$protected" -eq 1 ]; then
            if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
              echo "::error::Vercel Preview Protection blocked the media smoke. Configure repository secret VERCEL_AUTOMATION_BYPASS_SECRET (Protection Bypass for Automation) so CI can verify the protected preview."
            else
              echo "::error::Vercel Preview Protection still blocked the media smoke; the configured automation bypass secret was not accepted."
            fi
            exit 1
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::error::Vercel /models did not render at least 45 canonical vehicle-media references"
            exit 1
          fi
          if ! grep -q 'vehicle-media/toyota/toyota/bz4x/ea10/' "$html"; then
            echo "::error::Vercel catalogue did not render the newly ingested Toyota bZ4X media"
            exit 1
          fi
          echo "Vercel media smoke passed: protected preview was reached and the live catalogue is reading published Supabase media."

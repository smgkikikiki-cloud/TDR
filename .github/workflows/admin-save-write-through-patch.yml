name: Admin save write-through patch

on:
  push:
    branches:
      - fix/admin-save-write-through
    paths:
      - .github/workflows/admin-save-write-through-patch.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-save-write-through
          fetch-depth: 0

      - name: Patch admin save path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          actions = "app/admin/vehicle-editor-actions.ts"
          replace_once(
              actions,
              '  findDuplicateMarketTrim, isStaleRelease, applySourceRefEdits,\n',
              '  findDuplicateMarketTrim, applySourceRefEdits,\n',
          )
          replace_once(
              actions,
              'import { loadVehicleWorkspace, liveModelReleaseId } from "@/lib/canonical-editor";\n',
              'import { loadVehicleWorkspace } from "@/lib/canonical-editor";\n',
          )
          replace_once(
              actions,
              '''Both build a canonical batch and write it: the editor owns this data, so\n * Save is the decision, not a request for one. The only thing standing\n * between the form and the write is integrity -- the release the page was\n * rendered from must still be the live one, so a save cannot silently\n * overwrite an edit that landed while the form sat open -- and\n * enqueueCanonicalInputBatch's (batch_key, payload-hash) idempotency, so a\n * retry after a transient failure resolves to the same batch instead of\n * losing the edit or writing it twice.\n''',
              '''Both build a canonical batch and write it: the editor owns this data, so\n * Save is the decision, not a request for one. Saves are compiled against the\n * latest workspace at submit time and inserted durably into canonical_input_batches\n * immediately; the editor reads those pending writes through while GitHub/release\n * publication finishes in the background. Batch-key/payload-hash idempotency keeps\n * retries from losing an edit or writing it twice.\n''',
          )
          replace_once(
              actions,
              '''function assertNotStale(pageReleaseId: string, liveReleaseId: string) {\n  if (isStaleRelease(pageReleaseId, liveReleaseId)) {\n    throw new Error(\n      "มี canonical release ใหม่ออกมาระหว่างที่เปิดหน้านี้ ข้อมูลบนหน้าจอจึงอาจไม่ตรงกับของจริงแล้ว "\n      + "กรุณากด refresh หน้านี้แล้วแก้ไขใหม่อีกครั้ง (กันการเขียนทับข้อมูลที่เพิ่งอัปเดตไป)",\n    );\n  }\n}\n\n''',
              '',
          )
          replace_once(
              actions,
              '''  const modelId = requiredField(formData, "model_id", "canonical model");\n  const pageReleaseId = requiredField(formData, "page_release_id", "release fingerprint");\n  const workspace = await loadWorkspaceOrThrow(modelId);\n  assertNotStale(pageReleaseId, workspace.releaseId);\n''',
              '''  const modelId = requiredField(formData, "model_id", "canonical model");\n  const workspace = await loadWorkspaceOrThrow(modelId);\n''',
          )
          replace_once(
              actions,
              '''  const modelId = requiredField(formData, "model_id", "canonical model");\n  const pageReleaseId = requiredField(formData, "page_release_id", "release fingerprint");\n  const workspace = await loadWorkspaceOrThrow(modelId);\n  if (!workspace.generation) throw new Error("รุ่นนี้ไม่มี active generation ให้เพิ่ม/แก้ MarketTrim");\n\n  // A release activating under an open form is an ordinary race, not a bug:\n  // the admin needs to see it on the page they are typing in.\n  if (isStaleRelease(pageReleaseId, workspace.releaseId)) {\n    return {\n      fieldErrors: {},\n      formError: "มี canonical release ใหม่ออกมาระหว่างที่เปิดหน้านี้ ข้อมูลบนหน้าจอจึงอาจไม่ตรงกับของจริงแล้ว "\n        + "กรุณา refresh หน้านี้แล้วแก้ไขใหม่อีกครั้ง",\n    };\n  }\n''',
              '''  const modelId = requiredField(formData, "model_id", "canonical model");\n  const workspace = await loadWorkspaceOrThrow(modelId);\n  if (!workspace.generation) throw new Error("รุ่นนี้ไม่มี active generation ให้เพิ่ม/แก้ MarketTrim");\n''',
          )

          editor = "lib/canonical-editor.ts"
          replace_once(
              editor,
              'import { normalizeTrimForEditor, type NormalizedTrim } from "@/lib/trim-editor-state";\n',
              'import { normalizeTrimForEditor, type NormalizedTrim } from "@/lib/trim-editor-state";\nimport { applyPendingCanonicalBatches } from "@/lib/canonical-pending-overlay";\n',
          )
          replace_once(
              editor,
              '''  code: string;\n  segment: string | null;\n  launched: string | null;\n''',
              '''  code: string;\n  segment: string | null;\n  seats: number | null;\n  launched: string | null;\n''',
          )
          replace_once(
              editor,
              '      ? db.from("current_vehicle_generations").select("canonical_id,model_id,code,segment,launched,ended").eq("canonical_id", model.generation_id).maybeSingle()\n',
              '      ? db.from("current_vehicle_generations").select("canonical_id,model_id,code,segment,launched,ended,payload").eq("canonical_id", model.generation_id).maybeSingle()\n',
          )
          replace_once(
              editor,
              '    db.from("canonical_vehicle_releases").select("release_id,as_of,payload").eq("release_id", model.release_id).maybeSingle(),\n',
              '    db.from("canonical_vehicle_releases").select("release_id,as_of,created_at,payload").eq("release_id", model.release_id).maybeSingle(),\n',
          )
          replace_once(
              editor,
              '''  }));\n\n  // canonical_input_batches carries no model FK; a batch is "related" when its\n''',
              '''  }));\n\n  // The queue insert is the Admin save. Read it through immediately so a\n  // redirect/refresh shows the value the owner just entered while canonical\n  // publication catches up asynchronously. Failed writes never overlay, and a\n  // published write disappears once the active release represents it.\n  applyPendingCanonicalBatches({\n    modelId,\n    activeReleaseCreatedAt: (release as any)?.created_at || null,\n    model,\n    generation: generation as any,\n    trims: trimRows,\n    fields,\n    batches: (batches || []) as any[],\n  });\n\n  // canonical_input_batches carries no model FK; a batch is "related" when its\n''',
          )
          replace_once(
              editor,
              '''      canonicalId: generation.canonical_id, modelId: generation.model_id, code: generation.code,\n      segment: generation.segment, launched: generation.launched, ended: generation.ended,\n''',
              '''      canonicalId: generation.canonical_id, modelId: generation.model_id, code: generation.code,\n      segment: generation.segment,\n      seats: Number.isFinite(Number((generation as any).seats ?? (generation as any).payload?.seats))\n        ? Number((generation as any).seats ?? (generation as any).payload?.seats) : null,\n      launched: generation.launched, ended: generation.ended,\n''',
          )

          page = "app/admin/(secure)/vehicles/[modelId]/page.tsx"
          replace_once(
              page,
              '      บันทึก {KIND_LABEL[saved] || "canonical"} แล้ว — ระบบกำลังเขียนและ publish ให้อัตโนมัติ ใช้เวลาสักครู่แล้วรีเฟรช\n',
              '      บันทึก {KIND_LABEL[saved] || "canonical"} แล้ว — ค่าที่แก้แสดงทันที ส่วน canonical/GitHub publish ทำงานต่อเบื้องหลัง\n',
          )
          replace_once(
              page,
              '      <label className="adminField"><span>Seats (ปัจจุบัน: {(generation as any)?.seats || "—"})</span><input name="seats" type="number" min="1" step="1" /></label>\n',
              '      <label className="adminField"><span>Seats (ปัจจุบัน: {generation?.seats || "—"})</span><input name="seats" type="number" min="1" step="1" /></label>\n',
          )

          check = "scripts/check-trim-editor.ts"
          replace_once(
              check,
              '''const {\n  buildTrimEditBatch, diffTrimEdit, describeValue, composeReason,\n  findDuplicateMarketTrim, isStaleRelease, applySourceRefEdits, normalizedTrimName,\n} = await import("../lib/canonical-command-builder.ts");\n''',
              '''const {\n  buildTrimEditBatch, diffTrimEdit, describeValue, composeReason,\n  findDuplicateMarketTrim, isStaleRelease, applySourceRefEdits, normalizedTrimName,\n} = await import("../lib/canonical-command-builder.ts");\nconst { applyPendingCanonicalBatches, batchNeedsOptimisticOverlay } =\n  await import("../lib/canonical-pending-overlay.ts");\n''',
          )
          replace_once(
              check,
              '''  ok("a stale release comes back to the form too, not as a crash",\n    /isStaleRelease\\(pageReleaseId, workspace\\.releaseId\\)\\)\\s*\\{\\s*return/.test(actions));\n''',
              '''  ok("an old page release no longer blocks an Admin save",\n    !/isStaleRelease\\(pageReleaseId, workspace\\.releaseId\\)/.test(actions)\n    && !/const pageReleaseId = requiredField\\(formData, "page_release_id"/.test(actions));\n''',
          )
          marker = '''// =====================================================================\nconsole.log("\\nsource-text regression — the shape the mandate requires");\n// =====================================================================\n'''
          p = Path(check)
          text = p.read_text()
          if marker not in text:
              raise SystemExit("trim-editor optimistic overlay test insertion anchor missing")
          overlay_test = r'''// =====================================================================
console.log("\nTEST 11 — Admin save is read-through while canonical publication is pending");
// =====================================================================
{
  const trimId = "aion.aion_ut.gen1.trim.400_standard_range_bev";
  const trim = {
    canonicalId: trimId,
    name: "420 Standard",
    powertrain: "BEV",
    sourceRefs: {},
    editor: normalizeTrimForEditor({
      payload: { specs: { name: "420 Standard", powertrain: "BEV", battery_kwh: 50.27 } },
      fields: FIELDS, canonicalId: trimId, generationId: "aion.aion_ut.gen1",
      name: "420 Standard", powertrain: "BEV",
    }),
  };
  const model = { name_en: "Aion UT", name_th: "ไอออน ยูที", body_type: "HATCHBACK" };
  const generation = {
    code: "gen1", segment: "B", seats: 5, launched: "2025-06-24", ended: null,
    payload: { seats: 5 },
  };
  applyPendingCanonicalBatches({
    modelId: "aion.aion_ut",
    activeReleaseCreatedAt: "2026-09-26T06:39:28Z",
    model, generation, trims: [trim], fields: FIELDS,
    batches: [{
      status: "QUEUED", created_at: "2026-09-26T07:00:00Z",
      payload: { commands: [
        {
          operation: "UPSERT_MODEL_BUNDLE", canonical_id: "aion.aion_ut",
          payload: {
            model: { name_en: "Aion UT live" }, generation: { code: "gen1", seats: 5 },
            trims: [{ canonical_id: trimId, name: "420 Standard", powertrain: "BEV", battery_kwh: 51 }],
          },
        },
        {
          operation: "APPEND_SPEC", canonical_id: trimId,
          payload: {
            trim_id: trimId, field_key: "powertrain.max_power_kw", value_state: "KNOWN", value: 100,
            qualifiers: { output_scope: "MOTOR" },
          },
        },
      ] },
    }],
  });
  check("queued MarketTrim value is visible immediately", trim.editor.editableSpecs.battery_kwh.value, "51");
  check("queued spec value is visible immediately", trim.editor.editableSpecs.max_power_kw.value, "100");
  check("queued spec qualifiers survive read-through", trim.editor.editableSpecs.max_power_kw.qualifiers.output_scope, "MOTOR");
  check("queued model edit is visible immediately", model.name_en, "Aion UT live");
  ok("a queued write remains visible even if another release appeared later",
    batchNeedsOptimisticOverlay({ status: "QUEUED", created_at: "2026-09-26T06:00:00Z" }, "2026-09-26T07:00:00Z"));
  ok("failed writes never overlay",
    !batchNeedsOptimisticOverlay({ status: "FAILED", created_at: "2026-09-26T08:00:00Z" }, "2026-09-26T07:00:00Z"));
  ok("a published write already covered by the active release stops overlaying",
    !batchNeedsOptimisticOverlay({ status: "PUBLISHED", created_at: "2026-09-26T06:00:00Z" }, "2026-09-26T07:00:00Z"));
}

'''
          p.write_text(text.replace(marker, overlay_test + marker, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full repository checks
        run: npm run check

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "TDR admin patch"
          git config user.email "noreply@github.com"
          git add app/admin/vehicle-editor-actions.ts lib/canonical-editor.ts app/admin/'(secure)'/vehicles/'[modelId]'/page.tsx scripts/check-trim-editor.ts lib/canonical-pending-overlay.ts
          git commit -m "Make Admin vehicle saves read-through immediately"
          git push origin HEAD:fix/admin-save-write-through

name: CI-fix owner trim import

on:
  push:
    branches:
      - data/apply-owner-trims-2026-09-13

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix owner trim import against CI guards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revert protected canonical model surfaces to main
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('automotive/vehicle_master/vehreg/data/2026')
          models_dir = root / 'models'
          report_path = root / 'market/trims/research/owner_directory_2026-09-13/apply_report.json'

          protected = {
              'kia.ev6',
              'suzuki.fronx',
              'jaecoo.jaecoo_5_ev',
              'honda.crv',
              'aion.aion_v',
              'nissan.x_trail',
              'geely.geely_ex5',
              'subaru.forester',
              'toyota.bz4x',
              'mg.mg_s5_ev',
              'hyundai.ioniq5',
              'mg.mg_hs',
              'jaecoo.jaecoo_6t_ev',
              'jaecoo.jaecoo_7',
              'mazda.cx30',
              'deepal.deepal_s07',
              'gwm.haval_h6',
              'deepal.deepal_s05',
              'byd.sealion6',
              'byd.atto3',
              'toyota.corolla_cross',
              'volvo.ex40',
          }

          def model_id(brand, model):
              return f"{brand.get('id')}.{model.get('id')}"

          def baseline(path):
              rel = path.as_posix()
              raw = subprocess.check_output(['git', 'show', f'origin/main:{rel}'], text=True)
              return json.loads(raw)

          reverted = []
          for path in sorted(models_dir.glob('*.json')):
              cur = json.loads(path.read_text(encoding='utf-8'))
              base = baseline(path)
              base_brand = base['brand']
              base_by_id = {model_id(base_brand, m): m for m in base.get('models', [])}
              changed = False
              for i, model in enumerate(cur.get('models', [])):
                  mid = model_id(cur['brand'], model)
                  if mid in protected and mid in base_by_id and model != base_by_id[mid]:
                      cur['models'][i] = base_by_id[mid]
                      reverted.append(mid)
                      changed = True
              if changed:
                  path.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          final_delta = 0
          changed_models = 0
          for path in sorted(models_dir.glob('*.json')):
              cur = json.loads(path.read_text(encoding='utf-8'))
              base = baseline(path)
              cur_brand, base_brand = cur['brand'], base['brand']
              base_by_id = {model_id(base_brand, m): m for m in base.get('models', [])}
              for model in cur.get('models', []):
                  mid = model_id(cur_brand, model)
                  bm = base_by_id.get(mid)
                  if bm is None:
                      continue
                  if model != bm:
                      changed_models += 1
                  cur_trims = sum(len(g.get('trims', [])) for g in model.get('generations', []))
                  base_trims = sum(len(g.get('trims', [])) for g in bm.get('generations', []))
                  final_delta += cur_trims - base_trims

          report = json.loads(report_path.read_text(encoding='utf-8'))
          report['initial_trims_added'] = report.get('trims_added', 885)
          report['trims_added'] = final_delta
          report['changed_models'] = changed_models
          report['ci_guard_reverted_models'] = sorted(set(reverted))
          report['ci_guard_reverted_model_count'] = len(set(reverted))
          report['ci_guard_reverted_trim_delta'] = report['initial_trims_added'] - final_delta
          notes = [n for n in report.get('notes', []) if '885 source-backed' not in n]
          notes.append(f'{final_delta} source-backed MarketTrim rows remain after respecting existing repository guard tests.')
          notes.append(f'{len(set(reverted))} protected model surfaces were restored exactly to main rather than weakening existing tests.')
          report['notes'] = notes
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = report_path.with_name('README_apply.md')
          readme.write_text(
              '# Owner directory canonical application\n\n'
              'This directory is the provenance bundle for the owner-provided 321-nameplate trim directory imported on 2026-09-13.\n\n'
              f'- 321 / 321 source nameplates matched to canonical models.\n'
              f'- {final_delta} source-backed MarketTrim rows remain promoted after repository guard enforcement.\n'
              f'- {len(set(reverted))} protected model surfaces were restored exactly to main because existing tests intentionally forbid or tightly specify their MarketTrim set.\n'
              '- 153 source trim rows remain unresolved from the supplied directory itself: 152 ambiguous powertrain and 1 concept/future-production row.\n'
              '- 57 source-backed powertrain disagreements with analytical Variant data remain flagged for separate canonical review.\n',
              encoding='utf-8'
          )
          print(json.dumps({'reverted_models': sorted(set(reverted)), 'final_trims_added': final_delta, 'changed_models': changed_models}, indent=2))
          PY
      - name: Install Vehicle Master dependencies
        working-directory: automotive/vehicle_master
        run: python -m pip install -r requirements.txt pytest
      - name: Validate and test Vehicle Master
        working-directory: automotive/vehicle_master
        run: |
          python -m compileall -q vehreg pages tests
          python -m vehreg market validate
          python -m pytest -q
      - name: Commit corrected canonical files through Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['GITHUB_SHA']
          branch = os.environ['GITHUB_REF_NAME']
          roots = [
              'automotive/vehicle_master/vehreg/data/2026/models',
              'automotive/vehicle_master/vehreg/data/2026/market/trims/research/owner_directory_2026-09-13/apply_report.json',
              'automotive/vehicle_master/vehreg/data/2026/market/trims/research/owner_directory_2026-09-13/README_apply.md',
          ]
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--', *roots], text=True).splitlines()
          if not paths:
              raise SystemExit('No corrective changes generated')
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          def api(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(base + path, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)
          base_commit = api('GET', f'/git/commits/{head}')
          entries = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = api('POST', '/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('POST', '/git/trees', {'base_tree': base_commit['tree']['sha'], 'tree': entries})
          commit = api('POST', '/git/commits', {'message': 'Respect canonical guard tests in owner trim import', 'tree': tree['sha'], 'parents': [head]})
          api('PATCH', f'/git/refs/heads/{branch}', {'sha': commit['sha'], 'force': False})
          print(commit['sha'])
          PY

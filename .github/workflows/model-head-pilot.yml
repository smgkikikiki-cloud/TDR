name: Model head backfill pilot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/model-head-pilot.yml"
      - "automotive/vehicle_master/scripts/discover_model_heads.py"
      - "scripts/apply-model-head-manifest.ts"
      - "lib/canonical-data.ts"
      - "app/admin/model-head-actions.ts"
      - "app/admin/(secure)/vehicles/[modelId]/page.tsx"
      - "supabase/migration_v50_model_head_override.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover pilot images without production writes
        working-directory: automotive/vehicle_master
        run: python scripts/discover_model_heads.py --pilot --workers 4 --max-pages 4
      - name: Preserve manifest and original image bytes for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-head-pilot-${{ github.sha }}
          path: |
            automotive/vehicle_master/integration_data/model_head_manifest.jsonl
            automotive/vehicle_master/integration_data/model_head_manifest.review.csv
            automotive/vehicle_master/data/media/cache/model-head
          if-no-files-found: warn
          retention-days: 14
      - name: Attempt every active canonical Model without production writes
        working-directory: automotive/vehicle_master
        run: python scripts/discover_model_heads.py --workers 6 --max-pages 3 --output integration_data/model_head_full.jsonl
      - name: Probe publication fallback for unsupported brands
        working-directory: automotive/vehicle_master
        run: |
          python scripts/publication_head_fallback.py \
            --input integration_data/model_head_full.jsonl \
            --output integration_data/model_head_publication_pilot.jsonl \
            --model-ids mazda.cx5 nissan.almera mitsubishi.pajero_sport mercedes_benz.c_class audi.a4 lexus.es volvo.xc60 hyundai.tucson kia.ev6 porsche.cayenne
      - name: Preserve publication fallback pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-head-publication-pilot-${{ github.sha }}
          path: |
            automotive/vehicle_master/integration_data/model_head_publication_pilot.jsonl
            automotive/vehicle_master/data/media/cache/model-head
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve full manifest and review list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-head-full-${{ github.sha }}
          path: |
            automotive/vehicle_master/integration_data/model_head_full.jsonl
            automotive/vehicle_master/integration_data/model_head_full.review.csv
            automotive/vehicle_master/data/media/cache/model-head
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Dry-run the seven visually inspected pilot images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("automotive/vehicle_master/integration_data/model_head_manifest.jsonl")
          approved = {"bmw.bmw_3", "byd.atto3", "byd.seal", "gwm.haval_h6",
                      "toyota.camry", "toyota.corolla_cross", "toyota.hilux_champ"}
          rows = [json.loads(line) for line in source.read_text().splitlines()]
          if {r["model_id"] for r in rows if r["status"] == "READY"} != approved:
              raise SystemExit("Pilot selection changed; visual approval must be repeated")
          for row in rows:
              row["approved"] = row["model_id"] in approved
          Path("/tmp/model-head-pilot-approved.jsonl").write_text(
              "".join(json.dumps(row) + "\n" for row in rows))
          PY
          npm run media:model-head:apply -- --manifest /tmp/model-head-pilot-approved.jsonl


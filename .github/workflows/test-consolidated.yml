name: Test TDR consolidated

on:
  pull_request:
  push:
    branches:
      - main
      - 'consolidation/**'

permissions:
  contents: read

jobs:
  vehicle-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automotive/vehicle_master/requirements.txt
      - name: Install Vehicle Master dependencies
        working-directory: automotive/vehicle_master
        run: python -m pip install -r requirements.txt pytest
      - name: Fetch base tree for automated price PR
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'pricebot/') || startsWith(github.head_ref, 'pricefeed/'))
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
      - name: Guard automated price PR
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'pricebot/') || startsWith(github.head_ref, 'pricefeed/'))
        working-directory: automotive/vehicle_master
        run: python tools/pricefeed_guard.py --base "${{ github.event.pull_request.base.sha }}" --repo-prefix automotive/vehicle_master/
      - name: Compile Vehicle Master
        working-directory: automotive/vehicle_master
        run: python -m compileall -q vehreg pages tests
      - name: Test Vehicle Master
        working-directory: automotive/vehicle_master
        run: pytest -q
      - name: Validate Vehicle Master
        working-directory: automotive/vehicle_master
        run: python -m vehreg market validate
      - name: Build full canonical release
        working-directory: automotive/vehicle_master
        run: |
          python -m tdr_bridge.release \
            --inventory integration_data/tdr_2026-09-09.json \
            --overrides integration_data/crosswalk_overrides.json \
            --revision "${GITHUB_SHA}" --as-of 2026-09-09 \
            --out /tmp/vehicle-release.json
          python -m tdr_bridge.publish /tmp/vehicle-release.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guard public registration entitlement boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings '.from("registrations")' \
            lib/data.ts app/models app/reports \
            --include='*.ts' --include='*.tsx'; then
            echo 'Raw registrations must not be queried from public catalogue/report code.' >&2
            echo 'Use a future entitlement-aware server projection instead.' >&2
            exit 1
          fi
      - name: Guard retired repository routing
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number 'vehicle[-]market[-]master' .github scripts \
            --include='*.yml' --include='*.yaml' --include='*.sh' --include='*.ts' --include='*.js' 2>/dev/null; then
            echo 'Active automation must target TDR, never the retired Vehicle Master repository.' >&2
            exit 1
          fi
      - run: npm run build

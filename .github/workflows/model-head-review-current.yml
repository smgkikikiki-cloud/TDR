name: Model head review current

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/model-head-review-current.yml"
      - "automotive/vehicle_master/scripts/discover_model_heads.py"
      - "automotive/vehicle_master/scripts/render_model_head_review.py"
      - "scripts/apply-model-head-manifest.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover missing Toyota model heads
        working-directory: automotive/vehicle_master
        run: |
          python scripts/discover_model_heads.py \
            --workers 5 --max-pages 4 \
            --model-ids \
              toyota.avanza toyota.c_hr toyota.crown toyota.gr_supra toyota.gr86 \
              toyota.harrier toyota.hiace_majesty toyota.hilux_travo_cab \
              toyota.hilux_travo_double_cab toyota.land_cruiser_300 toyota.noah \
              toyota.prius toyota.vellfire toyota.voxy \
            --output integration_data/model_head_toyota.jsonl
      - name: Cache all discovered candidates for visual review
        working-directory: automotive/vehicle_master
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from vehreg.official_media.pipeline import fetch_bytes

          manifest = Path("integration_data/model_head_toyota.jsonl")
          out = Path("data/media/candidate-review")
          out.mkdir(parents=True, exist_ok=True)
          ext = {"image/jpeg": ".jpg", "image/png": ".png", "image/webp": ".webp", "image/avif": ".avif"}
          for row in [json.loads(line) for line in manifest.read_text().splitlines() if line.strip()]:
              seen = set()
              urls = []
              if row.get("selected_image"):
                  urls.append(("selected", row["selected_image"]))
              for i, candidate in enumerate(row.get("review_candidates") or [], 1):
                  urls.append((f"candidate-{i}", candidate.get("image_url")))
              for label, url in urls:
                  if not url or url in seen:
                      continue
                  seen.add(url)
                  try:
                      body, mime = fetch_bytes(url)
                      mime = mime.split(";", 1)[0].lower()
                      suffix = ext.get(mime)
                      if not suffix:
                          continue
                      target = out / row["model_id"] / f"{label}{suffix}"
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(body)
                      print(row["model_id"], label, len(body), urlparse(url).path)
                  except Exception as exc:
                      print(row["model_id"], label, "FAILED", type(exc).__name__)
          PY
      - name: Prepare exactly the three visually reviewed Toyota heads
        working-directory: automotive/vehicle_master
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path
          from urllib.parse import urlparse

          reviewed = {
              "toyota.hilux_travo_cab": {
                  "generation_id": "toyota.hilux_travo_cab.gen1",
                  "sha256": "485c30ee52398d65062d2db7632e45908384a56763f0e2b114b06d38a0de1da7",
                  "width": 959,
                  "height": 586,
              },
              "toyota.hilux_travo_double_cab": {
                  "generation_id": "toyota.hilux_travo_double_cab.gen1",
                  "sha256": "073d1f521d06778bcc615070b93ddbf614c8e1aa26f6f29b4dc7da0eac2c85cf",
                  "width": 959,
                  "height": 586,
              },
              "toyota.vellfire": {
                  "generation_id": "toyota.vellfire.gen1",
                  "sha256": "9576a5614578bebee4770b4012fe53b2d795e7963ff9a283e52881a1d19bfe48",
                  "width": 959,
                  "height": 586,
              },
          }
          rows_by_model = {
              row["model_id"]: row
              for row in [
                  json.loads(line)
                  for line in Path("integration_data/model_head_toyota.jsonl").read_text().splitlines()
                  if line.strip()
              ]
          }
          review_root = Path("data/media/candidate-review")
          cache_root = Path("data/media/cache")
          approved = []
          for model_id, spec in reviewed.items():
              row = rows_by_model[model_id]
              matches = list((review_root / model_id).glob("selected.*"))
              if len(matches) != 1:
                  raise SystemExit(f"{model_id}: expected one selected candidate, got {matches}")
              candidate = matches[0]
              digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
              if digest != spec["sha256"]:
                  raise SystemExit(f"{model_id}: reviewed bytes changed ({digest}); refusing production write")
              if row.get("selected_image") is None or row.get("source_url") is None:
                  raise SystemExit(f"{model_id}: missing reviewed provenance")
              source_domain = urlparse(row["source_url"]).hostname or ""
              if source_domain != "www.toyota.co.th":
                  raise SystemExit(f"{model_id}: unexpected source host {source_domain}")
              suffix = candidate.suffix.lower()
              if suffix not in {".jpg", ".png", ".webp", ".avif"}:
                  raise SystemExit(f"{model_id}: unsupported format {suffix}")
              rel = Path("model-head") / model_id / f"{digest}{suffix}"
              target = cache_root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(candidate, target)
              approved.append({
                  "model_id": model_id,
                  "generation_id": spec["generation_id"],
                  "status": "READY",
                  "selected_image": row["selected_image"],
                  "source_url": row["source_url"],
                  "source_domain": source_domain,
                  "source_type": "official_site",
                  "sha256": digest,
                  "storage_path": rel.as_posix(),
                  "confidence": 90,
                  "width": spec["width"],
                  "height": spec["height"],
                  "approved": True,
              })
          Path("/tmp/model-head-approved.jsonl").write_text(
              "".join(json.dumps(row) + "\n" for row in approved), encoding="utf-8"
          )
          print(json.dumps({"approved": [row["model_id"] for row in approved]}))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply only the SHA-pinned reviewed Toyota heads
        run: node --experimental-strip-types scripts/apply-model-head-manifest.ts --manifest /tmp/model-head-approved.jsonl --apply
      - name: Render visual review page
        working-directory: automotive/vehicle_master
        run: |
          python scripts/render_model_head_review.py \
            integration_data/model_head_toyota.jsonl \
            --output integration_data/model_head_toyota.html
      - name: Preserve review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-head-toyota-${{ github.sha }}
          path: |
            automotive/vehicle_master/integration_data/model_head_toyota.jsonl
            automotive/vehicle_master/integration_data/model_head_toyota.review.csv
            automotive/vehicle_master/integration_data/model_head_toyota.html
            automotive/vehicle_master/data/media/cache/model-head
            automotive/vehicle_master/data/media/candidate-review
          if-no-files-found: warn
          retention-days: 7

name: Mark canonical input batch status

# Thin administrative action: moves ONE existing canonical_input_batches row
# to NEEDS_REVIEW or REJECTED so the scheduled canonical-input sweeper stops
# retrying it. Uses the same Supabase secrets already configured for
# Actions. Never applies CanonicalInputPipeline, never edits canonical data,
# never commits or publishes, and never touches the row's payload,
# payload_sha256, or batch_key -- only status/updated_at/error.
on:
  workflow_dispatch:
    inputs:
      batch_key:
        description: "canonical_input_batches.batch_key to update"
        required: true
        type: string
      status:
        description: "Target status"
        required: true
        type: choice
        options:
          - NEEDS_REVIEW
          - REJECTED
      reason:
        description: "Why this batch is being moved out of the retry path"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mark:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: automotive/vehicle_master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automotive/vehicle_master/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Preflight deployment secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SECRET_KEY}${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY before marking a batch."
            exit 1
          fi
          if ! probe=$(PYTHONPATH=. python tools/canonical_input_worker.py check 2>&1); then
            echo "::error::Configured Supabase URL/key cannot access the TDR canonical input table: ${probe}"
            exit 1
          fi
      - name: Mark batch status
        env:
          BATCH_KEY: ${{ inputs.batch_key }}
          TARGET_STATUS: ${{ inputs.status }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.mark_canonical_batch_status \
            --batch-key "$BATCH_KEY" --status "$TARGET_STATUS" --reason "$REASON"

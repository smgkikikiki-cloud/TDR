name: Mark canonical input batch status (closed)

# Vehicle DB v3 Phase 0 step 5. canonical_input_batches is read-only history
# (migration_v60); this administrative status mover can no longer write it.
on:
  workflow_dispatch:
    inputs:
      batch_key:
        description: "Legacy input (queue is read-only)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy queue is read-only
        run: |
          echo "::error::Legacy Vehicle DB write path is closed (Phase 0 step 5). canonical_input_batches is read-only history."
          exit 1

name: Apply Retail Lineup Bootstrap plan (closed)

# Vehicle DB v3 Phase 0 step 5. This workflow applied stored lineup plans to
# vehreg/data, pushed to main and published a file-backed release -- the
# legacy Vehicle Master write path, which is closed. The event hooks stay only
# so a stale caller gets an explicit failure; there is no schedule and no
# write permission.
on:
  repository_dispatch:
    types: [retail-lineup-bootstrap-apply]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy writer is closed
        run: |
          echo "::error::Legacy Vehicle DB write path is closed (Phase 0 step 5). Retail lineup plans may no longer be applied to vehreg/data or published as file-backed releases."
          exit 1

name: TDR Roadmap Contract

# Stage-0 central read-only verification. Never run policy or its self-tests
# from a PR's untrusted HEAD / synthetic merge checkout.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/portfolio/**'
      - 'orchestration/**'
      - '.github/workflows/portfolio-roadmap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-roadmap:
    name: portfolio-roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted central Roadmap and Stage-0 Enforcer
        uses: actions/checkout@v4
        with:
          repository: smgkikikiki-cloud/TDR
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-roadmap
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact trusted Roadmap version
        run: |
          echo "Trusted Roadmap commit: $(git -C trusted-roadmap rev-parse --verify HEAD)"
          test -f trusted-roadmap/orchestration/preflight.mjs
          test -f trusted-roadmap/orchestration/preflight.test.mjs
      - name: Verify owner-approved central roadmap and disabled execution
        working-directory: trusted-roadmap
        run: node orchestration/preflight.mjs --check-repo
      - name: Run trusted, central fail-closed Stage-0 regressions
        working-directory: trusted-roadmap
        run: node --test orchestration/preflight.test.mjs

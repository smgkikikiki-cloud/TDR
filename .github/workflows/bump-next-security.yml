name: Bump Next.js security patch

on:
  push:
    branches:
      - fix/next-security-15-5-24
    paths:
      - .github/workflows/bump-next-security.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/next-security-15-5-24
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Next.js and regenerate lockfile
        run: npm install next@15.5.24 --save-exact
      - name: Verify
        run: |
          npm run check
          npm run build
      - name: Commit generated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: upgrade Next.js to 15.5.24"
          git push origin HEAD:fix/next-security-15-5-24

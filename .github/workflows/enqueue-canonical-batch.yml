name: Enqueue canonical vehicle input batch (closed)

# Vehicle DB v3 Phase 0 step 5. The input remains in workflow_dispatch only so
# existing callers get a clear diagnostic; nothing is inserted or dispatched.
on:
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Legacy payload (no longer accepted)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy enqueue is closed
        run: |
          echo "::error::Legacy Vehicle DB write path is closed (Phase 0 step 5). canonical_input_batches no longer accepts new jobs."
          exit 1

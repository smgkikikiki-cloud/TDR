name: One-shot owner trim directory apply

on:
  push:
    branches:
      - data/apply-owner-trims-2026-09-13

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply owner trim directory
        run: python automotive/vehicle_master/tools/apply_owner_trim_directory.py

      - name: Validate Vehicle Master
        working-directory: automotive/vehicle_master
        run: |
          python -m compileall -q vehreg
          python -m vehreg market validate

      - name: Show generated diff summary
        run: |
          git diff --stat -- automotive/vehicle_master/vehreg/data/2026/models automotive/vehicle_master/vehreg/data/2026/market/trims/research/owner_directory_2026-09-13/apply_report.json

      - name: Upload generated canonical files
        uses: actions/upload-artifact@v4
        with:
          name: owner-trim-generated-files
          path: |
            automotive/vehicle_master/vehreg/data/2026/models
            automotive/vehicle_master/vehreg/data/2026/market/trims/research/owner_directory_2026-09-13/apply_report.json
          if-no-files-found: error
          retention-days: 1

name: One-shot owner trim directory apply

on:
  push:
    branches:
      - data/apply-owner-trims-2026-09-13

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply owner trim directory
        run: python automotive/vehicle_master/tools/apply_owner_trim_directory.py

      - name: Validate Vehicle Master
        working-directory: automotive/vehicle_master
        run: |
          python -m compileall -q vehreg
          python -m vehreg market validate

      - name: Show generated diff summary
        run: |
          git diff --stat -- automotive/vehicle_master/vehreg/data/2026/models automotive/vehicle_master/vehreg/data/2026/market/trims/research/owner_directory_2026-09-13/apply_report.json

      - name: Upload generated canonical files
        uses: actions/upload-artifact@v4
        with:
          name: owner-trim-generated-files
          path: |
            automotive/vehicle_master/vehreg/data/2026/models
            automotive/vehicle_master/vehreg/data/2026/market/trims/research/owner_directory_2026-09-13/apply_report.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated files through Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["GITHUB_SHA"]
          branch = os.environ["GITHUB_REF_NAME"]
          roots = [
              "automotive/vehicle_master/vehreg/data/2026/models",
              "automotive/vehicle_master/vehreg/data/2026/market/trims/research/owner_directory_2026-09-13/apply_report.json",
          ]
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "--", *roots], text=True
          ).splitlines()
          if not paths:
              print("No generated changes; nothing to commit")
              raise SystemExit(0)

          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"

          def api(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          base_commit = api("GET", f"/git/commits/{head}")
          entries = []
          for path in paths:
              raw = open(path, "rb").read()
              blob = api(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(raw).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              entries.append(
                  {"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]}
              )

          tree = api(
              "POST",
              "/git/trees",
              {"base_tree": base_commit["tree"]["sha"], "tree": entries},
          )
          commit = api(
              "POST",
              "/git/commits",
              {
                  "message": "Apply owner directory trims to canonical models",
                  "tree": tree["sha"],
                  "parents": [head],
              },
          )
          api(
              "PATCH",
              f"/git/refs/heads/{branch}",
              {"sha": commit["sha"], "force": False},
          )
          print(f"Committed {len(paths)} generated files as {commit['sha']}")
          PY

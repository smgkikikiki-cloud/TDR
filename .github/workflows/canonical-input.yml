name: Process canonical vehicle input (closed)

# Vehicle DB v3 Phase 0 step 5. Keep the event hook temporarily so a stale
# deployed admin build gets an explicit failure instead of silently dispatching
# a writer. There is deliberately no schedule and no write permission.
on:
  repository_dispatch:
    types: [canonical-input]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy writer is closed
        run: |
          echo "::error::Legacy Vehicle DB write path is closed (Phase 0 step 5). Vehicle Master in Supabase is authoritative; canonical_input_batches is read-only."
          exit 1

name: Recover owner pricing payload

on:
  push:
    branches:
      - data/owner-pricing-registry-2026-09-14

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover partial prepared payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          chunk_dir = Path('tmp/owner-pricing-payload')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in sorted(chunk_dir.glob('part*.txt')))
          compressed = base64.b64decode(encoded)
          dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
          raw = dec.decompress(compressed)
          out = chunk_dir / 'recovered.txt'
          out.write_bytes(raw)
          print('compressed bytes', len(compressed), 'recovered bytes', len(raw), 'eof', dec.eof)
          print(raw[:300].decode('utf-8', errors='replace'))
          PY
      - name: Commit recovered payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/owner-pricing-payload/recovered.txt
          git commit -m "Recover prepared owner pricing payload" || exit 0
          git push origin HEAD:data/owner-pricing-registry-2026-09-14

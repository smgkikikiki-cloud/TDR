name: Publish canonical vehicle release (closed)

# Vehicle DB v3 Phase 0 step 5. Git/releases are no longer a write path. There
# is deliberately no push trigger; manual invocation remains only to explain why
# the old publisher cannot be used.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy publisher is closed
        run: |
          echo "::error::Legacy Vehicle DB write path is closed (Phase 0 step 5). current_* serving is backed by the DB Vehicle Master; file-backed releases are read-only history."
          exit 1

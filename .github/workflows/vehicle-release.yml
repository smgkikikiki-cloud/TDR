name: Publish canonical vehicle release

on:
  push:
    branches: [main]
    paths:
      - "automotive/vehicle_master/vehreg/**"
      - "automotive/vehicle_master/integration_data/**"
      - "automotive/vehicle_master/tdr_bridge/**"
      - ".github/workflows/vehicle-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with source-import, canonical-input and pricefeed: this job
  # activates a canonical vehicle release exactly like they do, and a
  # separate concurrency group is what let an older commit's publish here
  # race a newer commit's publish from one of them (or vice versa) and
  # roll the active release backward. migration_v44's ordinal guard is the
  # second line of defense, for an out-of-order queue a shared group alone
  # cannot prevent.
  group: canonical-vehicle-input
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: automotive/vehicle_master
    steps:
      - uses: actions/checkout@v4
        with:
          # The push trigger above is already restricted to main; this
          # only changes workflow_dispatch, which otherwise lets a human
          # pick a different branch in the UI -- never correct for a
          # workflow that publishes straight to production. See
          # source-import.yml's checkout comment for the same reasoning.
          ref: main
      # Full ancestry of this one commit, needed to compute the
      # revision-ordinal below -- not every branch/tag in the repo. See
      # source-import.yml's checkout comment for why `fetch-depth: 0` was
      # failing here with "pack has 2 unresolved deltas".
      - name: Deepen this commit's history for the revision ordinal
        run: git fetch --no-tags --prune --no-recurse-submodules --depth=2147483647 origin "$(git rev-parse HEAD)"
      - name: Fail loudly if the deepen fetch left the checkout shallow
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Checkout is still shallow after the deepen fetch -- migration_v44's ordinal guard would be silently disabled."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automotive/vehicle_master/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Build release once
        run: |
          set -euo pipefail
          python -m tdr_bridge.release_enriched \
            --inventory integration_data/tdr_2026-09-09.json \
            --overrides integration_data/crosswalk_overrides.json \
            --out /tmp/vehicle-release.json \
            --revision "${GITHUB_SHA}" --as-of "$(date -u +%F)" \
            --revision-ordinal "$(git rev-list --count "${GITHUB_SHA}")"
          python -m tdr_bridge.publish /tmp/vehicle-release.json
      - name: Preserve validated canonical release
        uses: actions/upload-artifact@v4
        with:
          name: canonical-vehicle-release-${{ github.sha }}
          path: /tmp/vehicle-release.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage recovery copy
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TDR canonical release"
          git config user.email "noreply@github.com"
          git switch --orphan release-staging
          cp /tmp/vehicle-release.json vehicle-release.json
          git add vehicle-release.json
          git commit -m "Stage canonical release ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/release-staging
          git switch -f main
      - name: Preflight deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::Set repository Actions secret SUPABASE_URL before publishing canonical releases."
            exit 1
          fi
          if [ -z "${SUPABASE_SECRET_KEY}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Set SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY in repository Actions secrets."
            exit 1
          fi
          if ! probe=$(PYTHONPATH=. python tools/canonical_input_worker.py check 2>&1); then
            echo "::error::Configured Supabase URL/key cannot access the TDR canonical input table: ${probe}"
            exit 1
          fi
      # No mark-published call here: this job publishes whatever commit
      # touched vehreg/** as a safety net, with no view of which specific
      # canonical_input_batches rows (if any) that commit carried. Marking
      # arbitrary STAGED batches PUBLISHED without that context is exactly
      # the "sweep everything" bookkeeping mark-published (invoked from
      # canonical-input.yml, which DOES have that context) was rewritten
      # to stop doing. Publishing itself -- and migration_v44's staleness
      # guard against activating it out of order -- still applies here.
      - name: Publish atomically to TDR Supabase
        run: python -m tdr_bridge.publish /tmp/vehicle-release.json --publish

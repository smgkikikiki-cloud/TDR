name: Consolidate Vehicle Engine (one-shot)

on:
  push:
    branches:
      - consolidation/phase-b-engine
    paths:
      - '.github/workflows/consolidate-vehicle-engine.yml'

permissions:
  contents: write

jobs:
  import-engine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDR destination branch
        uses: actions/checkout@v4
        with:
          ref: consolidation/phase-b-engine
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Clone canonical Vehicle Master source
        run: |
          git clone --depth 1 --branch consolidation/phase-a-baseline \
            https://github.com/smgkikikiki-cloud/vehicle-market-master.git \
            /tmp/vehicle-market-master
          test "$(git -C /tmp/vehicle-market-master rev-parse HEAD)" = "8cd44655fb2ad4b52f2cb523d6aa757cd2ea1b82"

      - name: Import engine intact under TDR
        run: |
          mkdir -p automotive/vehicle_master
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            /tmp/vehicle-market-master/ automotive/vehicle_master/
          cat > automotive/vehicle_master/TDR_IMPORT.md <<'EOF'
          # Vehicle Master import into TDR

          Phase B consolidation import.

          Source repository: `smgkikikiki-cloud/vehicle-market-master`
          Source commit: `8cd44655fb2ad4b52f2cb523d6aa757cd2ea1b82`

          This directory is an intact import of the canonical Python vehicle engine and its committed data/tests/tooling. It is intentionally nested first so the import does not rewrite working engine behavior while TDR's Next.js application continues to build unchanged.

          Canonical domains imported here include vehicle identity, Variant vs MarketTrim separation, PriceLedger, comparable specs, ECO ingestion, DLT matching/warehouse, provenance, and DLT Trim Ledger.

          This commit does **not** import registration rows into Supabase and does **not** make the legacy TDR `trims.price_baht` authoritative. Serving projections and entitlement changes are later consolidation phases.
          EOF

      - name: Test imported Vehicle Master unchanged
        working-directory: automotive/vehicle_master
        run: |
          python -m pip install -r requirements.txt pytest
          python -m compileall -q vehreg pages tests
          pytest -q
          python -m vehreg market validate

      - name: Verify TDR web still builds
        run: |
          npm ci
          npm run build

      - name: Commit imported engine to Phase B branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automotive/vehicle_master
          if git diff --cached --quiet; then
            echo "No engine changes to commit"
            exit 0
          fi
          git commit -m "Consolidation Phase B: import canonical Vehicle Master engine"
          git push origin HEAD:consolidation/phase-b-engine

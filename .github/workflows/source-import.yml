name: Run uploaded source imports (legacy writer closed)

# Vehicle DB v3 Phase 0 step 5. Keep repository_dispatch temporarily so an old
# deployed uploader fails visibly; there is no schedule and no canonical-file
# or release write in this workflow anymore.
on:
  repository_dispatch:
    types: [source-import]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy writer is closed
        run: |
          echo "::error::Legacy Vehicle DB write path is closed (Phase 0 step 5). Source imports must use the DB-master pipeline, not vehreg/data releases."
          exit 1

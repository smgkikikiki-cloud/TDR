name: Run uploaded source imports

on:
  # An upload dispatches this directly; the schedule is only a sweeper for a
  # dispatch that never arrived. Nobody waits on the clock.
  repository_dispatch:
    types: [source-import]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-vehicle-input
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: automotive/vehicle_master
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SECRET_KEY}${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::Source import is paused until Supabase credentials are configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automotive/vehicle_master/requirements.txt
      - if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Import every uploaded file
        if: steps.preflight.outputs.ready == 'true'
        run: PYTHONPATH=. python tools/import_worker.py run --limit 5
      # Which runs this publish will carry, captured before the push so the
      # finalize afterwards names them instead of sweeping whatever happens
      # to be pending -- another run's work is not this run's to complete.
      - name: Which runs are waiting on this publish
        if: steps.preflight.outputs.ready == 'true'
        id: pending
        run: echo "runs=$(PYTHONPATH=. python tools/import_worker.py pending-runs)" >> "$GITHUB_OUTPUT"
      - name: Commit what the import wrote
        if: steps.preflight.outputs.ready == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain vehreg/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "TDR source import"
          git config user.email "noreply@github.com"
          git add vehreg/data
          git commit -m "Apply uploaded source import"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Publish here, in this job, for the exact commit just pushed. Pushing
      # and trusting vehicle-release.yml to notice is not a publish path:
      # nothing fails if it never fires, and the run would report success
      # over data nobody is serving.
      - name: Publish the pushed revision
        if: steps.preflight.outputs.ready == 'true' && steps.commit.outputs.changed == 'true'
        id: publish
        run: |
          set -euo pipefail
          result=$(PYTHONPATH=. python -m tools.publish_canonical --revision "${{ steps.commit.outputs.sha }}")
          echo "$result"
          echo "release_id=$(echo "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["release_id"])')" >> "$GITHUB_OUTPUT"
      - name: Complete the runs this publish carried
        if: steps.preflight.outputs.ready == 'true' && steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          args=""
          for run in ${{ steps.pending.outputs.runs }}; do args="$args --run-id $run"; done
          PYTHONPATH=. python tools/import_worker.py finalize $args \
            --commit-sha "${{ steps.commit.outputs.sha }}" \
            --release-id "${{ steps.publish.outputs.release_id }}"

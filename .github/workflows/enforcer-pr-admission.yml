name: TDR Enforcer PR Admission

# Stage 1: PR evidence checker only. No secrets, service accounts, paid APIs,
# agent dispatch, merges, deployments, data writes or scheduled runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enforcer-stage1-tests:
    name: enforcer-stage1-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only run Enforcer self-tests from a trusted, versioned checkout of
      # default-branch code. Historical PR HEADs do not contain these scripts.
      - name: Checkout trusted central Enforcer implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-enforcer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record trusted Enforcer version and verify self-tests
        working-directory: trusted-enforcer
        run: |
          echo "Trusted Enforcer SHA: $(git rev-parse HEAD)"
          node --test orchestration/preflight.test.mjs
          node --test orchestration/pr-admission.test.mjs
          node --test orchestration/pr-admission.integration.test.mjs
          if [ -f orchestration/historical-pr-audit.test.mjs ]; then
            node --test orchestration/historical-pr-audit.test.mjs
          fi
      - name: Verify trusted Stage-0 plan remains disabled
        working-directory: trusted-enforcer
        run: node orchestration/preflight.mjs --check-repo

  enforcer-pr-admission:
    name: enforcer-pr-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Central compatibility code comes from trusted main; any BASE-supplied
      # checker still takes precedence when it exists in the target PR base.
      # Never execute candidate HEAD scripts as CI governance authority.
      - name: Checkout trusted central Enforcer for historical fallback
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-enforcer
          persist-credentials: false
      - name: Checkout trusted base-commit policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate HEAD as untrusted input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authentic PR diff and preserve historical audit-only mode
        run: |
          echo "Central Enforcer implementation SHA: $(git -C trusted-enforcer rev-parse HEAD)"
          if [ -f policy/orchestration/pr-admission.mjs ]; then
            # Modern PR: retain the exact trusted BASE policy, not HEAD or main.
            node policy/orchestration/pr-admission.mjs \
              --event "$GITHUB_EVENT_PATH" \
              --policy-root "$PWD/policy" \
              --candidate-root "$PWD/candidate"
          else
            # Historical base: never imply task admission. A managed packet or
            # a governance-tampering candidate is DENIED, not auto-accepted.
            node trusted-enforcer/orchestration/historical-pr-audit.mjs \
              --event "$GITHUB_EVENT_PATH" \
              --policy-root "$PWD/policy" \
              --candidate-root "$PWD/candidate"
          fi

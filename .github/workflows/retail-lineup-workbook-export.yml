name: Generate retail lineup bootstrap workbooks

on:
  repository_dispatch:
    types: [retail-lineup-workbook-export]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-lineup-workbook-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: automotive/vehicle_master
    steps:
      - uses: actions/checkout@v4
        with:
          # A generated workbook is an authoritative snapshot of the production
          # canonical tree, not of whichever feature branch happened to dispatch
          # this workflow.
          ref: main
      - name: Preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SECRET_KEY}${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::Retail lineup workbook export is paused until Supabase credentials are configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automotive/vehicle_master/requirements.txt
      - if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Generate queued workbooks
        if: steps.preflight.outputs.ready == 'true'
        run: PYTHONPATH=. python -m tools.retail_lineup_workbook_export_worker --limit 5

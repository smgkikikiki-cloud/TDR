name: Align SUV taxonomy

on:
  push:
    branches:
      - fix/align-suv-taxonomy

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Align body choices to Vehicle Master
        run: python scripts/align_suv_taxonomy.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name "smgkikikiki-cloud"
          git config user.email "smgkikikiki@gmail.com"
          git add app components lib
          git commit -m "Align TDR SUV taxonomy to Vehicle Master" || true
          git push

name: Temporary AION ES comparable spec backfill

on:
  push:
    branches: [feature/vehreg-fill-batch-01]
    paths:
      - ".github/workflows/tmp-aion-es-backfill.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vehreg-fill-batch-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill AION ES structured specs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from automotive.vehicle_master.vehreg.catalog import Catalog
          from automotive.vehicle_master.vehreg.comparable_specs import SpecRegistry
          from automotive.vehicle_master.vehreg.canonical_write import CanonicalWritePipeline
          DATA=Path('automotive/vehicle_master/vehreg/data'); YEAR=2026
          catalog=Catalog.load(DATA,YEAR); registry=SpecRegistry.load(DATA,YEAR); pipe=CanonicalWritePipeline(DATA)
          trim=[t for t in catalog.trims_of('aion.aion_es') if 'Standard' in t.name][0]
          facts_root=DATA/str(YEAR)/'product'/'comparable_specs'/'facts'
          existing={}
          for path in facts_root.glob('*.json'):
            try: payload=json.loads(path.read_text(encoding='utf-8'))
            except Exception: continue
            for f in payload.get('facts',[]):
              if f.get('trim_id')==trim.id: existing.setdefault(f.get('field_key'),[]).append(f)
          def qkey(field,qual):
            d=registry.fields[field]
            return tuple((k,str((qual or {}).get(k,''))) for k in d.comparison_qualifiers)
          def has(field,qual=None):
            target=qkey(field,qual)
            return any(qkey(field,f.get('qualifiers') or {})==target for f in existing.get(field,[]))
          def add(field,value,src,qual=None,status='VERIFIED'):
            d=registry.fields[field]; qual=qual or {}
            if d.applicable_powertrains and trim.powertrain.value not in d.applicable_powertrains: return False
            if has(field,qual): return False
            unit=d.canonical_unit if d.value_type.value=='NUMBER' else ''
            fact={'field_key':field,'value_state':'KNOWN','value':value,'unit':unit,'qualifiers':qual,
                  'observed_at':'2026-09-26','verification_status':status,'source':'official_gac',
                  'source_ref':src,'source_locator':src}
            h=hashlib.sha1((trim.id+'|'+field+'|'+json.dumps(qual,sort_keys=True,ensure_ascii=False)).encode()).hexdigest()[:24]
            pipe.apply({'command_id':'aion-es-'+h,'operation':'APPEND_SPEC','year':YEAR,'actor':'tdr-aion-es',
                        'reason':'AION ES official GAC Thailand structured spec backfill','canonical_id':trim.id,
                        'payload':fact,'submitted_at':'2026-09-26T01:20:00+07:00'})
            existing.setdefault(field,[]).append({**fact,'trim_id':trim.id}); return True
          G='https://www.gacgroup.com/th-th/configuration/aion-es/2024'
          P='https://www.gacgroup.com/th-th/sedan/aion-es'
          rows=[
            ('vehicle.ground_clearance_mm',120,G,{'load_state':'LADEN'}),
            ('vehicle.cargo_volume_l',450,G,{'measurement_basis':'OEM','seat_configuration':'SEATS_UP'}),
            ('vehicle.curb_weight_kg',1665,G,{'measurement_basis':'OEM'}),
            ('vehicle.declared_total_weight_kg',2135,G,{}),
            ('powertrain.motor_type','Permanent magnet synchronous motor',G,{}),
            ('powertrain.motor_count',1,G,{}),
            ('powertrain.max_power_kw',100,G,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
            ('powertrain.max_torque_nm',225,G,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
            ('performance.acceleration_0_100_s',12.1,G,{'measurement_basis':'OEM'}),
            ('performance.top_speed_kmh',150,P,{'measurement_basis':'OEM'}),
            ('battery.chemistry','LFP',G,{}),
            ('battery.chemistry_as_declared','Magazine Battery (Lithium iron phosphate)',G,{}),
            ('ev.rated_range_km',442,G,{'measurement_basis':'NEDC','range_scope':'COMBINED'}),
            ('ev.energy_consumption_wh_km',136,G,{'measurement_basis':'NEDC','range_scope':'COMBINED'}),
            ('charging.dc_time_min',40,P,{}),
            ('chassis.suspension_front','Independent MacPherson strut',G,{}),
            ('chassis.suspension_rear','Non-independent torsion beam',G,{}),
            ('comfort.power_windows',True,G,{}),
            ('comfort.auto_climate',True,G,{}),
            ('comfort.electric_parking_brake',True,G,{}),
            ('technology.led_headlights',True,G,{}),
            ('safety.abs',True,G,{}),
            ('safety.esc',True,G,{})
          ]
          added=0
          for r in rows:
            if add(*r): added+=1
          applicable={k for k,d in registry.fields.items() if not d.applicable_powertrains or trim.powertrain.value in d.applicable_powertrains}
          covered=set(existing)&applicable
          audit={'trim_id':trim.id,'registry_fields':len(registry.fields),'applicable_fields':len(applicable),'covered_applicable':len(covered),'missing_applicable':len(applicable)-len(covered),'added_this_run':added,'missing_fields':sorted(applicable-covered)}
          print('AUDIT',json.dumps(audit,ensure_ascii=False))
          PY
          git config user.name "TDR vehicle data bot"
          git config user.email "noreply@github.com"
          git rm .github/workflows/tmp-aion-es-backfill.yml
          git add automotive/vehicle_master/vehreg/data/2026/product/comparable_specs automotive/vehicle_master/vehreg/data/2026/canonical_state
          git commit -m "data(vehreg): complete AION ES structured spec pass"
          git push origin HEAD:feature/vehreg-fill-batch-01
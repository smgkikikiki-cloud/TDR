name: Verify browser Supabase fallback

on:
  push:
    branches:
      - fix/browser-supabase-public-config
    paths:
      - lib/supabase-browser.ts
      - .github/workflows/browser-supabase-fallback.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

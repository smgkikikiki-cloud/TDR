name: Temporary Audi A7 canonical patch

on:
  push:
    branches: [feature/vehreg-fill-batch-01]
    paths:
      - ".github/workflows/tmp-fill-audi-a7.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vehreg-fill-batch-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch A7 and remove helper
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('automotive/vehicle_master/vehreg/data/2026/models/audi.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          model = next(m for m in data['models'] if m['id'] == 'a7')
          model.clear()
          model.update({
            'id': 'a7',
            'name_en': 'A7',
            'name_th': 'เอ7',
            'nameplate': '',
            'body_type': 'SEDAN',
            'cab_type': 'NOT_APPLICABLE',
            'registration_type': '',
            'market_scope': 'NICHE',
            'aliases': ['A7 SB', 'A7 Sportback'],
            'notes': 'Thai-market A7 Sportback C8 retail lineup verified on 2026-09-26. Current Audi Thailand price list contains two 55 TFSI e quattro PHEV grades: S line and S line Black Edition. Earlier 45 TFSI combustion grade is retained as historical owner-directory evidence rather than current retail.',
            'retail_status': 'CURRENT',
            'retail_checked_at': '2026-09-26',
            'retail_source': 'https://www.audi.co.th/en/models/a7/a7-sportback-tfsi-e/',
            'generations': [{
              'code': 'C8',
              'segment': 'E',
              'seats': 5,
              'launched': '2023-11-14',
              'ended': None,
              'variants': [
                {
                  'name': '55 TFSI e quattro PHEV',
                  'powertrain': 'PHEV',
                  'drivetrain': 'AWD',
                  'engine_cc': 1984,
                  'battery_kwh': 17.9,
                  'price_thb': 4799000,
                  'price_min_thb': 4799000,
                  'price_max_thb': 5099000,
                  'import_type': 'CBU',
                  'origin_country': 'DE',
                  'price_note': 'Current Audi Thailand recommended prices: S line THB 4,799,000; S line Black Edition THB 5,099,000.',
                  'aliases': ['A7 Sportback 55 TFSI e quattro S line', 'A7 Sportback 55 TFSI e quattro S line Black Edition']
                },
                {
                  'name': '45 TFSI quattro ICE (historical)',
                  'powertrain': 'ICE',
                  'drivetrain': 'AWD',
                  'engine_cc': 1984,
                  'battery_kwh': None,
                  'price_thb': None,
                  'price_min_thb': None,
                  'price_max_thb': None,
                  'import_type': 'CBU',
                  'origin_country': 'DE',
                  'price_note': 'Historical owner-directory grade; not in current 2026 Audi Thailand price list.',
                  'aliases': ['A7 Sportback 45 TFSI quattro S line Black Edition'],
                  'incomplete': True
                }
              ],
              'trims': [
                {
                  'name': 'Sportback 55 TFSI e quattro S line',
                  'variant': '55 TFSI e quattro PHEV',
                  'powertrain': 'PHEV',
                  'drivetrain': 'AWD',
                  'seats': 5,
                  'length_mm': 4969,
                  'width_mm': 1908,
                  'height_mm': 1421,
                  'wheelbase_mm': 2926,
                  'engine_cc': 1984,
                  'battery_kwh': 17.9,
                  'transmission': '7-speed S tronic',
                  'source_refs': {
                    'eco': ['0128920e-65e2-41cd-b7d3-74fcaaa5e9fb'],
                    'official_audi': ['https://www.audi.co.th/en/models/a7/a7-sportback-tfsi-e/', 'https://www.audi.co.th/dam/nemo/sea/th/pdf/Audi_Price_List.pdf'],
                    'headlightmag': ['https://www.headlightmag.com/2023-11-14-audi-a7-sportback-55-tfsi-e/']
                  },
                  'aliases': ['A7 Sportback 55 TFSI e quattro S line'],
                  'id': 'sportback_55_tfsi_e_quattro_s_line_phev',
                  'notes': 'Thai PHEV: 2.0 TFSI + electric motor, 367 PS system output, 500 Nm, quattro AWD, 17.9 kWh battery, 7-speed S tronic, up to 69 km WLTP EV range.'
                },
                {
                  'name': 'Sportback 55 TFSI e quattro S line Black Edition',
                  'variant': '55 TFSI e quattro PHEV',
                  'powertrain': 'PHEV',
                  'drivetrain': 'AWD',
                  'seats': 5,
                  'length_mm': 4969,
                  'width_mm': 1908,
                  'height_mm': 1421,
                  'wheelbase_mm': 2926,
                  'engine_cc': 1984,
                  'battery_kwh': 17.9,
                  'transmission': '7-speed S tronic',
                  'tire_front': '255/40 R20',
                  'tire_rear': '255/40 R20',
                  'wheel_front': '20 in',
                  'wheel_rear': '20 in',
                  'source_refs': {

                    'headlightmag': ['https://www.headlightmag.com/2023-11-14-audi-a7-sportback-55-tfsi-e/']
                  },
                  'aliases': ['A7 Sportback 55 TFSI e quattro S line Black Edition'],
                  'id': 'sportback_55_tfsi_e_quattro_s_line_black_edition_phev',
                  'notes': 'Thai PHEV: 367 PS / 500 Nm, quattro AWD, 17.9 kWh battery; Black Edition uses 20-inch wheels with 255/40 R20 tyres.'
                },
                {
                  'name': 'Sportback 45 TFSI quattro S line Black Edition',
                  'variant': '45 TFSI quattro ICE (historical)',
                  'powertrain': 'ICE',
                  'drivetrain': 'AWD',
                  'source_refs': {'owner_directory': ['owner_directory_2026_09_13:011']},
                  'aliases': ['A7 Sportback 45 TFSI quattro S line Black Edition'],
                  'id': 'sportback_45_tfsi_quattro_s_line_black_edition_ice',
                  'notes': 'Historical owner-directory row; not promoted into current 2026 retail lineup.'
                }
              ]
            }],
            'powertrain_checked': True
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "TDR vehicle data bot"
          git config user.email "noreply@github.com"
          git rm .github/workflows/tmp-fill-audi-a7.yml
          git add automotive/vehicle_master/vehreg/data/2026/models/audi.json
          git commit -m "data(vehreg): verify Audi A7 Thai-market lineup"
          git push origin HEAD:feature/vehreg-fill-batch-01

name: Model Head Discovery Current

on:
  workflow_dispatch:
  push:
    branches:
      - feature/model-head-discovery-current
    paths:
      - '.github/workflows/model-head-discovery-current.yml'
      - 'automotive/vehicle_master/scripts/discover_model_heads.py'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover five missing Mercedes-Benz model heads
        working-directory: automotive/vehicle_master
        run: |
          python scripts/discover_model_heads.py \
            --workers 3 --max-pages 3 \
            --model-ids \
              mercedes_benz.a_class \
              mercedes_benz.mb_c_class \
              mercedes_benz.cla \
              mercedes_benz.cle \
              mercedes_benz.cls \
            --output integration_data/model_head_mercedes_5.jsonl
      - name: Upload review manifest and candidate bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-head-mercedes-5-${{ github.sha }}
          path: |
            automotive/vehicle_master/integration_data/model_head_mercedes_5.jsonl
            automotive/vehicle_master/integration_data/model_head_mercedes_5.review.csv
            automotive/vehicle_master/data/media/cache/model-head
          if-no-files-found: warn
          retention-days: 7

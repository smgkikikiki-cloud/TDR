name: Official media pilot

on:
  push:
    branches: [feat/official-media-ingestion]
    paths:
      - ".github/workflows/official-media-pilot.yml"
      - "automotive/vehicle_master/scripts/ingest_official_media.py"
      - "automotive/vehicle_master/vehreg/official_media/**"
      - "scripts/publish-official-media.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-media-pilot
  cancel-in-progress: true

jobs:
  pilot-30:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automotive/vehicle_master/requirements.txt

      - name: Install Python dependencies
        working-directory: automotive/vehicle_master
        run: python -m pip install -r requirements.txt pytest

      - name: Run official-media unit tests
        working-directory: automotive/vehicle_master
        run: python -m pytest -q tests/test_official_media.py

      - name: Crawl 30 canonical Thai-market models
        working-directory: automotive/vehicle_master
        run: |
          python scripts/ingest_official_media.py \
            --year 2026 \
            --max-pages 8 \
            --vehicle-ids \
              toyota.camry.xv80 \
              toyota.corolla_cross.xg10 \
              toyota.yaris_ativ.mxpa10 \
              toyota.yaris_cross.ac200 \
              toyota.alphard.ah40 \
              toyota.hilux_champ.champ \
              honda.accord.cy \
              honda.civic.fe \
              honda.crv.rs \
              honda.hrv.rv \
              honda.city.gn2 \
              honda.wrv.dg \
              byd.atto2.atto2 \
              byd.atto3.atto3 \
              byd.dolphin.dol \
              byd.seal.seal \
              byd.sealion5.sealion5 \
              byd.sealion6.sl6 \
              byd.sealion7.sl7 \
              byd.byd_m6.m6 \
              mg.mg3.mg3h \
              mg.mg4.mg4e \
              mg.mg_s5_ev.gen1 \
              mg.mg_im6.gen1 \
              mg.mg_cyberster.gen1 \
              mg.mg_maxus_9.mifa9 \
              gwm.haval_h6.h6hev \
              gwm.tank300.t300 \
              gwm.tank500.t500 \
              gwm.poer_sahar.gen1

      - name: Summarize pilot coverage
        working-directory: automotive/vehicle_master
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("integration_data/official_media/run_summary_2026.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          if len(rows) != 30:
              raise SystemExit(f"expected 30 pilot identities, got {len(rows)}")
          covered = sum(row["assets"] > 0 for row in rows)
          approved = sum(row.get("approved", 0) > 0 for row in rows)
          assets = sum(row["assets"] for row in rows)
          reviews = sum(row["review"] for row in rows)
          with open("/tmp/media-pilot-summary.md", "w") as out:
              out.write(f"# Official media pilot\n\n30 identities attempted. {covered}/30 produced assets; {approved}/30 produced at least one auto-approved asset. {assets} assets cached; {reviews} review flags.\n\n")
              out.write("| Brand | Model | Assets | Approved | Review |\n|---|---|---:|---:|---:|\n")
              for row in rows:
                  out.write(f"| {row['brand']} | {row['model']} | {row['assets']} | {row.get('approved', 0)} | {row['review']} |\n")
          print(Path("/tmp/media-pilot-summary.md").read_text())
          PY
          cat /tmp/media-pilot-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve crawl evidence
        uses: actions/upload-artifact@v4
        with:
          name: official-media-pilot-${{ github.sha }}
          path: |
            automotive/vehicle_master/integration_data/official_media
            automotive/vehicle_master/data/media/cache
            /tmp/media-pilot-summary.md
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Preflight publish credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::SUPABASE_URL is not configured in Actions secrets"
            exit 1
          fi
          if [ -z "${SUPABASE_SECRET_KEY}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is required"
            exit 1
          fi

      - name: Publish approved pilot assets and metadata
        run: npm run media:publish -- --year 2026

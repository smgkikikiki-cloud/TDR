name: Diagnose BMW official media

on:
  workflow_dispatch:
  push:
    branches: [feat/official-media-scale-100]
    paths:
      - ".github/workflows/official-media-bmw-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe BMW Scene7 stage assets
        working-directory: automotive/vehicle_master
        run: |
          python - <<'PY'
          import hashlib
          from vehreg.official_media.pipeline import fetch_bytes

          urls = {
              "X1": "https://bmw.scene7.com/is/image/BMW/DI22_000076802%3A16to7?fit=wrap%2C+1&fmt=webp&wid=1920",
              "X3": "https://bmw.scene7.com/is/image/BMW/g45_ice_stage_dsk_fb?fmt=webp&qlt=80&wid=1920",
          }
          for label, url in urls.items():
              print(f"\n=== {label} Scene7 ===")
              try:
                  body, ctype = fetch_bytes(url, timeout=25)
                  print(f"bytes={len(body)} content_type={ctype!r} sha256={hashlib.sha256(body).hexdigest()}")
                  print(f"magic={body[:16]!r}")
                  if not ctype.lower().startswith("image/"):
                      raise SystemExit(f"{label}: expected image content type, got {ctype!r}")
              except Exception as exc:
                  print(f"ERROR {type(exc).__name__}: {exc}")
                  raise
          PY

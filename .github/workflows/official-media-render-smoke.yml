name: Official media render smoke

on:
  push:
    branches: [feat/official-media-scale-100]
    paths:
      - ".github/workflows/official-media-render-smoke.yml"
      - "app/models/**"
      - "app/compare/**"
      - "lib/canonical-data.ts"
      - "lib/supabase.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify /models renders canonical media from production Supabase
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          html=/tmp/local-models.html
          log=/tmp/tdr-next.log
          PORT=3000 npm start >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          status=000
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::Next production server exited before the smoke test completed"
              cat "$log"
              exit 1
            fi
            status=$(curl -sS --max-time 20 -o "$html" -w '%{http_code}' "http://127.0.0.1:3000/models?media-smoke=${GITHUB_SHA}" || true)
            echo "Local production /models status=${status} (attempt ${attempt})"
            [ "$status" = "200" ] && break
            sleep 2
          done

          if [ "$status" != "200" ]; then
            echo "::error::Local production /models never returned HTTP 200"
            cat "$log"
            exit 1
          fi

          refs=$(grep -o 'vehicle-media' "$html" | wc -l | tr -d ' ' || true)
          echo "Local production /models canonical media refs=${refs:-0}"
          if [ "${refs:-0}" -lt 50 ]; then
            echo "::error::Catalogue rendered fewer than 50 canonical vehicle-media references"
            exit 1
          fi
          grep -q 'vehicle-media/toyota/toyota/bz4x/ea10/' "$html" || {
            echo "::error::Catalogue did not render Toyota bZ4X media"
            exit 1
          }
          grep -q 'vehicle-media/bmw/bmw/bmw_x3/g45/' "$html" || {
            echo "::error::Catalogue did not render BMW X3 media"
            exit 1
          }
          echo "Production-build media smoke passed."

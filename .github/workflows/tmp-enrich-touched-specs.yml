name: Temporary enrich touched vehicle comparable specs

on:
  push:
    branches: [feature/vehreg-fill-batch-01]
    paths:
      - ".github/workflows/tmp-enrich-touched-specs.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vehreg-fill-batch-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add OEM-backed structured facts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from automotive.vehicle_master.vehreg.catalog import Catalog
          from automotive.vehicle_master.vehreg.comparable_specs import SpecRegistry
          from automotive.vehicle_master.vehreg.canonical_write import CanonicalWritePipeline

          DATA=Path('automotive/vehicle_master/vehreg/data'); YEAR=2026
          catalog=Catalog.load(DATA,YEAR); registry=SpecRegistry.load(DATA,YEAR); pipe=CanonicalWritePipeline(DATA)
          facts_root=DATA/str(YEAR)/'product'/'comparable_specs'/'facts'

          existing={}
          for path in facts_root.glob('*.json'):
            try: payload=json.loads(path.read_text(encoding='utf-8'))
            except Exception: continue
            for f in payload.get('facts',[]):
              tid=str(f.get('trim_id') or ''); key=str(f.get('field_key') or '')
              if tid and key: existing.setdefault(tid,{}).setdefault(key,[]).append(f)

          def qkey(field,qual):
            d=registry.fields[field]
            return tuple((k,str((qual or {}).get(k,''))) for k in d.comparison_qualifiers)
          def has(tid,field,qual=None):
            target=qkey(field,qual)
            return any(qkey(field,f.get('qualifiers') or {})==target for f in existing.get(tid,{}).get(field,[]))
          def trims(model_id, needle):
            xs=[t for t in catalog.trims_of(model_id) if needle.lower() in t.name.lower()]
            if not xs: raise RuntimeError(f'no trim: {model_id} / {needle}')
            return xs
          def one(model_id,needle):
            xs=trims(model_id,needle)
            if len(xs)!=1: raise RuntimeError(f'ambiguous trim: {model_id}/{needle}: {[x.name for x in xs]}')
            return xs[0]
          def add(trim,field,value,src,qual=None,observed='2026-09-26',status='VERIFIED'):
            if field not in registry.fields: raise RuntimeError(f'unknown field {field}')
            d=registry.fields[field]
            if d.applicable_powertrains and trim.powertrain.value not in d.applicable_powertrains: return False
            qual=qual or {}
            if has(trim.id,field,qual): return False
            unit=d.canonical_unit if d.value_type.value=='NUMBER' else ''
            fact={'field_key':field,'value_state':'KNOWN','value':value,'unit':unit,'qualifiers':qual,
                  'observed_at':observed,'verification_status':status,'source':'OEM_OR_PRIMARY_RESEARCH',
                  'source_ref':src,'source_locator':src}
            h=hashlib.sha1((trim.id+'|'+field+'|'+json.dumps(qual,sort_keys=True,ensure_ascii=False)).encode()).hexdigest()[:24]
            pipe.apply({'command_id':'enrich99-'+h,'operation':'APPEND_SPEC','year':YEAR,'actor':'tdr-enrich99',
                        'reason':'Structured comparable-spec repair from OEM/primary sources','canonical_id':trim.id,
                        'payload':fact,'submitted_at':'2026-09-26T00:30:00+07:00'})
            existing.setdefault(trim.id,{}).setdefault(field,[]).append({**fact,'trim_id':trim.id})
            return True
          count=0
          def A(t,*args,**kwargs):
            global count
            if add(t,*args,**kwargs): count+=1

          G_UT='https://www.gacgroup.com/th-th/configuration/aion-ut/2024'
          G_V='https://www.gacgroup.com/th-th/configuration/aion-v/2024'
          G_Y='https://www.gacgroup.com/th-th/configuration/aion-y-plus/2024'
          G_ES='https://www.gacgroup.com/th-th/configuration/aion-es/2024'
          G_HT='https://www.gacgroup.com/th-th/configuration/hyptec-ht/2024'

          # AION UT current Thai trims: official GAC Thailand configuration.
          for name,power,torque,accel,top,curb,gross,range_km,energy,dc in [
            ('420 Standard',100,145,11.6,145,1580,1990,420,133,70),
            ('500 Premium',150,210,7.3,160,1700,2110,500,140,87)]:
            t=one('aion.aion_ut',name)
            for field,val,qual in [

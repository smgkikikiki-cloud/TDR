            ('safety.side_airbag',True,{}),('safety.curtain_airbag',True,{}),('safety.abs',True,{}),('safety.esc',True,{}),
            ('safety.adaptive_cruise',True,{}),('safety.aeb',True,{}),('safety.forward_collision_warning',True,{}),

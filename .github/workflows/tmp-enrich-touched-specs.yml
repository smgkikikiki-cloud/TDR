name: Temporary enrich AION Y Plus comparable specs

on:
  push:
    branches: [feature/vehreg-fill-batch-01]
    paths:
      - ".github/workflows/tmp-enrich-touched-specs.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vehreg-fill-batch-01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enrich AION Y Plus 490 Premium
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from automotive.vehicle_master.vehreg.catalog import Catalog
          from automotive.vehicle_master.vehreg.comparable_specs import SpecRegistry
          from automotive.vehicle_master.vehreg.canonical_write import CanonicalWritePipeline

          DATA=Path('automotive/vehicle_master/vehreg/data'); YEAR=2026
          catalog=Catalog.load(DATA,YEAR); registry=SpecRegistry.load(DATA,YEAR); pipe=CanonicalWritePipeline(DATA)
          facts_root=DATA/str(YEAR)/'product'/'comparable_specs'/'facts'
          trim=[t for t in catalog.trims_of('aion.aion_y_plus') if '490 Premium' in t.name][0]
          existing={}
          for path in facts_root.glob('*.json'):
            try: payload=json.loads(path.read_text(encoding='utf-8'))
            except Exception: continue
            for f in payload.get('facts',[]):
              if f.get('trim_id')==trim.id:
                existing.setdefault(f.get('field_key'),[]).append(f)
          def qkey(field,qual):
            d=registry.fields[field]
            return tuple((k,str((qual or {}).get(k,''))) for k in d.comparison_qualifiers)
          def has(field,qual=None):
            target=qkey(field,qual)
            return any(qkey(field,f.get('qualifiers') or {})==target for f in existing.get(field,[]))
          def add(field,value,src,qual=None,status='VERIFIED'):
            d=registry.fields[field]; qual=qual or {}
            if d.applicable_powertrains and trim.powertrain.value not in d.applicable_powertrains: return False
            if has(field,qual): return False
            fact={'field_key':field,'value_state':'KNOWN','value':value,
                  'unit':d.canonical_unit if d.value_type.value=='NUMBER' else '',
                  'qualifiers':qual,'observed_at':'2026-09-26','verification_status':status,
                  'source':'official_gac','source_ref':src,'source_locator':src}
            h=hashlib.sha1((trim.id+'|'+field+'|'+json.dumps(qual,sort_keys=True,ensure_ascii=False)).encode()).hexdigest()[:24]
            pipe.apply({'command_id':'aion-yplus-'+h,'operation':'APPEND_SPEC','year':YEAR,'actor':'tdr-aion-yplus',
                        'reason':'AION Y Plus 490 Premium OEM structured spec backfill','canonical_id':trim.id,
                        'payload':fact,'submitted_at':'2026-09-26T01:00:00+07:00'})
            existing.setdefault(field,[]).append({**fact,'trim_id':trim.id}); return True

          G='https://www.gacgroup.com/th-th/configuration/aion-y-plus/2024'
          GENE='https://www.gacgroup.com/th-th/news/article/aion-thailand-%E0%B8%82%E0%B8%AD%E0%B8%9A%E0%B8%84%E0%B8%B8%E0%B8%93%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B9%84%E0%B8%A7%E0%B9%89%E0%B8%A7%E0%B8%B2%E0%B8%87%E0%B9%83%E0%B8%88-%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2%E0%B8%A2%E0%B8%AD%E0%B8%94%E0%B8%88%E0%B8%94%E0%B8%97%E0%B8%B0%E0%B9%80%E0%B8%9A%E0%B8%B5%E0%B8%A2%E0%B8%99-1-037-%E0%B8%84%E0%B8%B1%E0%B8%99-%E0%B9%83%E0%B8%99%E0%B9%80%E0%B8%94%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B8%A1%E0%B8%81%E0%B8%A3%E0%B8%B2%E0%B8%84%E0%B8%A1-2568-49'
          rows=[
            ('vehicle.ground_clearance_mm',150,G,{'load_state':'LADEN'}),
            ('vehicle.cargo_volume_l',405,G,{'measurement_basis':'OEM','seat_configuration':'SEATS_UP'}),
            ('vehicle.curb_weight_kg',1750,G,{'measurement_basis':'OEM'}),
            ('vehicle.declared_total_weight_kg',2180,G,{}),
            ('powertrain.motor_type','Permanent magnet synchronous motor',G,{}),
            ('powertrain.max_power_kw',150,G,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
            ('powertrain.max_torque_nm',225,G,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
            ('battery.chemistry','LFP',G,{}),
            ('battery.chemistry_as_declared','Magazine Battery (Lithium iron phosphate)',G,{}),
            ('ev.rated_range_km',490,G,{'measurement_basis':'NEDC','range_scope':'COMBINED'}),
            ('ev.energy_consumption_wh_km',139,GENE,{'measurement_basis':'NEDC','range_scope':'COMBINED'}),
            ('charging.v2l_supported',True,G,{}),
            ('chassis.suspension_front','MacPherson independent suspension',G,{}),
            ('chassis.suspension_rear','Torsion-beam suspension',G,{}),
            ('comfort.panoramic_roof',True,G,{}),
            ('comfort.keyless_entry',True,G,{}),
            ('comfort.power_windows',True,G,{}),
            ('comfort.auto_climate',True,G,{}),
            ('comfort.electric_parking_brake',True,G,{}),
            ('technology.connected_services',True,G,{}),
            ('technology.surround_view_camera',True,G,{}),
            ('technology.led_headlights',True,G,{}),
            ('safety.side_airbag',True,G,{}),
            ('safety.curtain_airbag',True,G,{}),
            ('safety.abs',True,G,{}),
            ('safety.esc',True,G,{}),
            ('safety.adaptive_cruise',True,G,{}),
            ('safety.aeb',True,G,{}),
            ('safety.forward_collision_warning',True,G,{}),
            ('safety.lane_departure_warning',True,G,{}),
            ('safety.lane_keep_assist',True,G,{})
          ]
          added=0
          for field,value,src,qual in rows:
            if add(field,value,src,qual): added+=1
          applicable={k for k,d in registry.fields.items() if not d.applicable_powertrains or trim.powertrain.value in d.applicable_powertrains}
          covered=set(existing)&applicable
          audit={'trim_id':trim.id,'registry_fields':len(registry.fields),'applicable_fields':len(applicable),'covered_applicable':len(covered),'missing_applicable':len(applicable)-len(covered),'added_this_run':added,'missing_fields':sorted(applicable-covered)}
          print('AUDIT',json.dumps(audit,ensure_ascii=False))
          Path('/tmp/aion-yplus-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "TDR vehicle data bot"
          git config user.email "noreply@github.com"
          git rm .github/workflows/tmp-enrich-touched-specs.yml
          git add automotive/vehicle_master/vehreg/data/2026/product/comparable_specs automotive/vehicle_master/vehreg/data/2026/canonical_state
          git commit -m "data(vehreg): complete AION Y Plus structured spec pass"
          git push origin HEAD:feature/vehreg-fill-batch-01
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-yplus-audit
          path: /tmp/aion-yplus-audit.json
          if-no-files-found: ignore

              ('technology.smartphone_mirroring',True,{}),('technology.led_headlights',True,{})]: A(t,field,val,H_A1,qual)

          # Audi A4 current/historical 40/45 spec lines.
          for t in catalog.trims_of('audi.a4'):
            if '40 TFSI' in t.name:

          for field,val,qual in [
            ('vehicle.ground_clearance_mm',120,{'load_state':'LADEN'}),('vehicle.cargo_volume_l',450,{'seat_configuration':'SEATS_UP','measurement_basis':'OEM'}),
            ('vehicle.curb_weight_kg',1665,{'measurement_basis':'OEM'}),('vehicle.gross_vehicle_weight_kg',2135,{'measurement_basis':'OEM'}),

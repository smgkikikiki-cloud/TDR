            else: continue
            for field,val,qual in [('powertrain.max_power_kw',p,{'output_scope':'ENGINE','rating_basis':'MAXIMUM'}),('powertrain.max_torque_nm',q,{'output_scope':'ENGINE','rating_basis':'MAXIMUM'}),

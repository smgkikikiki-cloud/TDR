          for name,cap,range_km,energy,dc,curb,gross,dms in [
            ('500 Premium',64.5,500,144,150,1790,2250,False),('602 Luxury',75.26,602,141,180,1880,2280,True)]:
            t=one('aion.aion_v',name)
            for field,val,qual in [
              ('vehicle.ground_clearance_mm',166,{'load_state':'UNLADEN'}),('vehicle.cargo_volume_l',427,{'seat_configuration':'SEATS_UP','measurement_basis':'OEM'}),
              ('vehicle.curb_weight_kg',curb,{'measurement_basis':'OEM'}),('vehicle.gross_vehicle_weight_kg',gross,{'measurement_basis':'OEM'}),
              ('vehicle.turning_radius_m',5.6,{'measurement_basis':'OEM'}),('powertrain.motor_type','Permanent magnet synchronous motor',{}),
              ('powertrain.motor_count',1,{}),('powertrain.max_power_kw',150,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
              ('powertrain.max_torque_nm',210,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),('performance.top_speed_kmh',160,{'measurement_basis':'OEM'}),
              ('battery.chemistry','LFP',{}),('battery.chemistry_as_declared','LFP',{}),

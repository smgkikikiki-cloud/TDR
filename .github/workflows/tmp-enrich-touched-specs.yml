              ('vehicle.cargo_volume_l',440,{'seat_configuration':'SEATS_UP','measurement_basis':'OEM_WATER_VOLUME'}),
              ('vehicle.curb_weight_kg',curb,{'measurement_basis':'OEM'}),('vehicle.gross_vehicle_weight_kg',gross,{'measurement_basis':'OEM'}),
              ('vehicle.turning_radius_m',5.35,{'measurement_basis':'OEM'}),('powertrain.motor_type','Permanent magnet synchronous motor',{}),
              ('powertrain.motor_count',1,{}),('powertrain.max_power_kw',power,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
              ('powertrain.max_torque_nm',torque,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
              ('performance.acceleration_0_100_s',accel,{'measurement_basis':'OEM'}),('performance.top_speed_kmh',top,{'measurement_basis':'OEM'}),
              ('battery.chemistry','LFP',{}),('battery.chemistry_as_declared','LFP',{}),
              ('ev.rated_range_km',range_km,{'measurement_basis':'NEDC','range_scope':'COMBINED'}),
              ('ev.energy_consumption_wh_km',energy,{'measurement_basis':'NEDC'}),('charging.ac_max_kw',6.6,{'rating_basis':'MAXIMUM'}),
              ('charging.dc_max_kw',dc,{'rating_basis':'MAXIMUM'}),('charging.dc_time_min',24,{'soc_from':'30%','soc_to':'80%','charger_power':f'{dc} kW'}),
              ('charging.v2l_supported',True,{}),('chassis.suspension_front','Independent MacPherson strut',{}),
              ('chassis.suspension_rear','Semi-independent torsion beam',{}),('comfort.power_windows',True,{}),
              ('comfort.electric_parking_brake',True,{}),('comfort.heat_pump',True,{}),('technology.smartphone_mirroring',True,{}),
              ('technology.connected_services',True,{}),('technology.surround_view_camera',True,{}),('technology.led_headlights',True,{}),
              ('safety.abs',True,{}),('safety.esc',True,{}),('safety.aeb',True,{}),('safety.forward_collision_warning',True,{}),
              ('safety.lane_departure_warning',True,{}),('safety.lane_keep_assist',True,{}),('safety.blind_spot',True,{}),('safety.rear_cross_traffic',True,{})]:
                A(t,field,val,G_UT,qual)


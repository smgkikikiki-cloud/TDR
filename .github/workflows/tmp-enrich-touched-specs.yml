              ('technology.connected_services',True,{}),('technology.surround_view_camera',True,{}),('technology.led_headlights',True,{}),('technology.head_up_display',True,{})]: A(t,field,val,H_A7 if field!='technology.connected_services' else AU_A7,qual)

          # Audi A8 L 60 TFSI e current Thai trim.

            ('performance.acceleration_0_100_s',12.1,{'measurement_basis':'OEM'}),('battery.chemistry','LFP',{}),('battery.chemistry_as_declared','Lithium iron phosphate (LFP)',{}),
            ('ev.rated_range_km',442,{'measurement_basis':'NEDC','range_scope':'COMBINED'}),('ev.energy_consumption_wh_km',136,{'measurement_basis':'NEDC'}),
            ('chassis.suspension_front','Independent MacPherson strut',{}),('chassis.suspension_rear','Non-independent torsion beam',{}),
            ('comfort.power_windows',True,{}),('comfort.auto_climate',True,{}),('comfort.electric_parking_brake',True,{}),
            ('technology.led_headlights',True,{}),('safety.abs',True,{}),('safety.esc',True,{})]: A(t,field,val,G_ES,qual)

          # HYPTEC HT 620 Premium.
          t=one('aion.hyptec_ht','620 Premium')
          for field,val,qual in [
            ('vehicle.ground_clearance_mm',158,{'load_state':'LADEN'}),('vehicle.cargo_volume_l',670,{'seat_configuration':'SEATS_UP','measurement_basis':'OEM'}),
            ('vehicle.curb_weight_kg',2232,{'measurement_basis':'OEM'}),('vehicle.gross_vehicle_weight_kg',2607,{'measurement_basis':'OEM'}),
            ('vehicle.turning_radius_m',5.6,{'measurement_basis':'OEM'}),('powertrain.motor_count',1,{}),
            ('powertrain.max_power_kw',250,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),('powertrain.max_torque_nm',430,{'output_scope':'SYSTEM','rating_basis':'MAXIMUM'}),
            ('performance.acceleration_0_100_s',6.3,{'measurement_basis':'OEM'}),('performance.top_speed_kmh',183,{'measurement_basis':'OEM'}),
            ('battery.chemistry','LFP',{}),('battery.chemistry_as_declared','LFP',{}),
            ('ev.rated_range_km',620,{'measurement_basis':'NEDC','range_scope':'COMBINED'}),('ev.energy_consumption_wh_km',150,{'measurement_basis':'NEDC'}),
            ('charging.ac_max_kw',6.6,{'rating_basis':'MAXIMUM'}),('charging.dc_max_kw',280,{'rating_basis':'MAXIMUM'}),
            ('charging.dc_time_min',15,{'soc_from':'30%','soc_to':'80%','charger_power':'280 kW'}),('charging.v2l_supported',True,{}),
            ('chassis.suspension_front','Independent double wishbone',{}),('chassis.suspension_rear','Independent five-link',{}),
            ('comfort.ventilated_front_seats',True,{}),('comfort.panoramic_roof',True,{}),('comfort.keyless_entry',True,{}),('comfort.power_windows',True,{}),
            ('comfort.auto_climate',True,{}),('comfort.electric_parking_brake',True,{}),('technology.smartphone_mirroring',True,{}),
            ('technology.connected_services',True,{}),('technology.surround_view_camera',True,{}),('technology.led_headlights',True,{}),
            ('safety.side_airbag',True,{}),('safety.curtain_airbag',True,{}),('safety.abs',True,{}),('safety.esc',True,{}),
            ('safety.adaptive_cruise',True,{}),('safety.aeb',True,{}),('safety.forward_collision_warning',True,{}),
            ('safety.lane_departure_warning',True,{}),('safety.lane_keep_assist',True,{}),('safety.blind_spot',True,{}),('safety.rear_cross_traffic',True,{})]: A(t,field,val,G_HT,qual)

          H_A1='https://www.headlightmag.com/offcial-price-audi-a1-35-tfsi-s-line/'
          H_A4='https://www.headlightmag.com/official-price-audi-a4-sedan-40-tfsi/'
          H_A4AV='https://www.headlightmag.com/official-price-audi-a4-avant-minorchange/'
          H_A5='https://www.headlightmag.com/official-price-audi-a5-sportback-tfsi-e/'
          H_A5AV='https://www.headlightmag.com/official-price-audi-a5-avant-tfsi-e-quattro/'
          AU_S6='https://www.audi.co.th/en/models/a6-e-tron/s6-sportback-e-tron/'
          AU_S6C='https://www.audi.co.th/en/models/a6-e-tron/s6-sportback-e-tron/range-charging/'
          AU_S6A='https://www.audi.co.th/en/models/a6-e-tron/s6-avant-e-tron/range-charging/'
          H_A7='https://www.headlightmag.com/2023-11-14-audi-a7-sportback-55-tfsi-e/'
          H_A8='https://www.headlightmag.com/2023-11-29-official-price-audi-a8-l-60-tfsi-e-quattro-prestige-s-line/'
          AU_A7='https://www.audi.co.th/en/models/a7/a7-sportback-tfsi-e/'

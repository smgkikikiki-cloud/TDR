          # AION Y Plus 490 Premium.
          t=one('aion.aion_y_plus','490 Premium')
          for field,val,qual in [
            ('vehicle.ground_clearance_mm',150,{'load_state':'LADEN'}),('vehicle.cargo_volume_l',405,{'seat_configuration':'SEATS_UP','measurement_basis':'OEM'}),
            ('vehicle.curb_weight_kg',1750,{'measurement_basis':'OEM'}),('vehicle.gross_vehicle_weight_kg',2180,{'measurement_basis':'OEM'}),
            ('powertrain.motor_type','Permanent magnet synchronous motor',{}),('powertrain.motor_count',1,{}),

          AU_PRICE='https://www.audi.co.th/dam/nemo/sea/th/pdf/Audi_Price_List.pdf'

          # Audi A1 35 TFSI S line historical/current-catalog spec.
          for t in trims('audi.a1','35 TFSI'):
            for field,val,qual in [('vehicle.cargo_volume_l',335,{'seat_configuration':'SEATS_UP','measurement_basis':'OEM'}),

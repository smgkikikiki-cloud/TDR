name: Price feed (legacy writer closed)

# Vehicle DB v3 Phase 0 step 5. Scheduled file-backed price writes are stopped
# until the DB-master feed is introduced in the later v3 phases.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Legacy option (writer is closed)"
        required: false

permissions:
  contents: read

jobs:
  closed:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy writer is closed
        run: |
          echo "::error::Legacy Vehicle DB write path is closed (Phase 0 step 5). Price updates may no longer write vehreg/data or publish file-backed releases."
          exit 1

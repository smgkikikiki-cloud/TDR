name: Finalize owner pricing registry

on:
  push:
    branches:
      - data/owner-pricing-registry-2026-09-14

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical price ledger and research report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, sys

          root = Path('.')
          tmp = root / 'tmp' / 'owner-pricing-payload'
          rows = []
          for name in ('recovered_rows.jsonl', 'remaining_rows.jsonl'):
              path = tmp / name
              if not path.exists():
                  raise SystemExit(f'missing {path}')
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      rows.append(json.loads(line))

          rows.sort(key=lambda r: r[0])
          indices = [r[0] for r in rows]
          if len(rows) != 170 or len(set(indices)) != 170:
              raise SystemExit(f'expected 170 unique source rows, got {len(rows)} / {len(set(indices))}')

          statuses = Counter(r[8] for r in rows)
          expected = {'APPLIED': 76, 'PARTIAL': 13, 'UNAPPLIED': 81}
          if dict(statuses) != expected:
              raise SystemExit(f'status coverage changed: {dict(statuses)} != {expected}')

          observations = []
          for row in rows:
              idx = row[0]
              for n, item in enumerate(row[10], 1):
                  trim_id, amount, source_grade, canonical_grade, method = item
                  observations.append({
                      'trim_id': trim_id,
                      'amount_thb': int(amount),
                      'price_type': 'LIST_PRICE',
                      'effective_from': None,
                      'effective_to': None,
                      'observed_at': '2026-09-14',
                      'source': 'owner_pricing_directory',
                      'source_ref': f'owner_pricing_directory_2026_09_14:{idx}:{n}',
                      'notes': f'Owner-supplied Thailand pricing directory; source grade: {source_grade}; canonical grade: {canonical_grade}; mapping: {method}. Promotion text is retained in the research registry and is not promoted as a live campaign because the source row has no reliable campaign validity window.',
                      'campaign_id': None,
                      'option_id': None,
                      'reference_price_thb': None,
                      'retracted_at': None,
                      'retraction_reason': '',
                      'reviewed_by': 'owner_directory_import',
                  })

          if len(observations) != 161:
              raise SystemExit(f'expected 161 canonical price observations, got {len(observations)}')
          trim_ids = [o['trim_id'] for o in observations]
          dupes = [k for k,v in Counter(trim_ids).items() if v > 1]
          if dupes:
              raise SystemExit(f'duplicate trim price targets: {dupes[:10]}')

          sys.path.insert(0, str(root / 'automotive' / 'vehicle_master'))
          from vehreg.catalog import Catalog
          catalog = Catalog.load()
          missing = sorted(set(trim_ids) - set(catalog.trims))
          if missing:
              raise SystemExit('mapped trim IDs absent from current canonical catalog: ' + ', '.join(missing[:20]))

          research_dir = root / 'automotive' / 'vehicle_master' / 'vehreg' / 'data' / '2026' / 'market' / 'prices' / 'research' / 'owner_pricing_registry_2026-09-14'
          research_dir.mkdir(parents=True, exist_ok=True)
          price_path = root / 'automotive' / 'vehicle_master' / 'vehreg' / 'data' / '2026' / 'market' / 'prices' / 'owner_registry_2026-09-14.json'

          columns = ['source_index','page','brand','nameplate','trim_level_raw','msrp_raw','campaign_raw','canonical_model_ids','apply_status','unresolved_reason','price_observations']
          (research_dir / 'records.json').write_text(json.dumps({
              'source':'owner_pricing_directory_2026_09_14',
              'columns':columns,
              'rows':rows,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          unresolved = [r for r in rows if r[8] != 'APPLIED']
          (research_dir / 'unresolved.json').write_text(json.dumps({
              'source':'owner_pricing_directory_2026_09_14',
              'columns':columns,
              'rows':unresolved,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          reasons = Counter(r[9] for r in rows if r[9])
          report = {
              'source':'owner_pricing_directory_2026_09_14',
              'source_record_count':len(rows),
              'fully_applied_rows':statuses['APPLIED'],
              'partially_applied_rows':statuses['PARTIAL'],
              'unapplied_rows':statuses['UNAPPLIED'],
              'rows_not_fully_applied':statuses['PARTIAL'] + statuses['UNAPPLIED'],
              'canonical_price_observations_added':len(observations),
              'unique_market_trims_priced':len(set(trim_ids)),
              'unresolved_reason_counts':dict(sorted(reasons.items())),
              'observed_at':'2026-09-14',
              'campaign_rows_promoted':0,
              'notes':[
                  'Only exact MSRP amounts bound to an existing canonical MarketTrim.id were promoted.',
                  'Grouped price ranges were retained as research and not fabricated into per-trim prices.',
                  'Promotion text is preserved verbatim in records.json but not promoted as a live campaign because reliable per-row start/end dates are absent.',
                  'Protected canonical surfaces were not modified to make price rows fit.',
              ],
          }
          (research_dir / 'apply_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (research_dir / 'README.md').write_text('''# Owner pricing registry — 2026-09-14\n\nThis directory preserves the owner-supplied Thailand automotive MSRP and promotion registry and records the canonicalization result.\n\nRules used for promotion into the canonical price ledger:\n\n- An MSRP is promoted only when the source supplies an exact amount that can be bound to one current canonical `MarketTrim.id`.\n- Grouped MSRP ranges are retained as research evidence but are not converted into fabricated per-trim prices.\n- Rows explicitly marked estimated or without an official Thai price are retained but not promoted.\n- Guard-protected canonical model surfaces are not modified just to make a price fit.\n- The source describes prices as current but gives no explicit publication/effective date, so promoted rows use `observed_at = 2026-09-14` and leave `effective_from = null`.\n- Promotion/campaign text is preserved verbatim in `records.json`. It is not installed as a live campaign because the source does not provide a reliable start/end window per campaign; doing so would make time-limited promotions appear indefinitely active.\n''', encoding='utf-8')
          price_path.write_text(json.dumps({'prices': observations}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Validate vehicle market ledger
        working-directory: automotive/vehicle_master
        shell: bash
        run: |
          python -m vehreg market validate
      - name: Remove temporary transport files
        shell: bash
        run: |
          rm -rf tmp/owner-pricing-payload
          rm -f .github/workflows/finalize-owner-pricing.yml
      - name: Commit finalized pricing registry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Apply owner pricing registry to canonical MarketTrim ledger" || exit 0
          git push origin HEAD:data/owner-pricing-registry-2026-09-14
